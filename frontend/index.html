<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PricePulse ZA</title>
<meta name="description" content="Compare grocery, liquor and pharmacy prices across South African stores.">
<meta name="theme-color" content="#b00d27">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: phone-first app shell. Sticky red header, scrolling content, fixed bottom nav.
   Sizes are in rem so the app follows the phone's text-size setting (1rem = 17px by default). */
:root{
  --bg:#f6f2f1; --card:#ffffff; --ink:#1d1415; --muted:#5a4d4e; --line:#d9cecd;
  --brand:#b00d27; --brand-ink:#ffffff; --brand-text:#b00d27; --best:#08532a; --best-bg:#e1f2e6; --warn:#7a4f00; --warn-bg:#fff3d6;
  --chip:#ece4e3; --chip-on:#1d1415; --chip-on-ink:#ffffff; --focus:#1d1415;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 7rem max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:8px;z-index:50;background:var(--card);padding:.5rem 1rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:40rem;margin:0 auto}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:var(--brand-ink);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:calc(.6rem + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) .7rem max(16px,env(safe-area-inset-left,0px))}
header :focus-visible{outline-color:#fff}
header .row{max-width:40rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:1.9rem;line-height:1;margin:0;font-weight:700}
.where{display:flex;align-items:center;gap:.4rem;font-weight:600}
.where select{background:#fff;color:#1d1415;border:2px solid #fff;border-radius:.5rem;padding:.3rem .5rem;min-height:3rem;max-width:11rem}
.locbtn{min-height:3rem;min-width:3rem;border-radius:.5rem;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;padding:0 .6rem;display:inline-flex;align-items:center;gap:.3rem}
.locbtn svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2}
.search{margin:.6rem auto 0;max-width:40rem}
.search input{width:100%;min-height:3rem;padding:.5rem .8rem;border-radius:.6rem;border:2px solid transparent;background:#fff;color:#1d1415;font-size:1.06rem}
.fresh{max-width:40rem;margin:.6rem auto 0;font-size:.94rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.banner{border-radius:.7rem;padding:.6rem .8rem;margin:.7rem 0;border:2px solid var(--line);background:var(--card)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)}
.banner b{display:block}
.pills{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 0 .3rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:3rem;padding:.4rem 1rem;border-radius:999px;border:2px solid var(--line);background:var(--chip);font-weight:600}
.pill[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.grid{display:flex;flex-direction:column;gap:.85rem;margin-top:.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.85rem;padding:.85rem;min-width:0}
.card h3{margin:0;font-size:1.12rem;line-height:1.25;font-weight:650}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.size{color:var(--muted);font-size:.94rem}
.top{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}
.add{flex:none;min-width:3rem;min-height:3rem;border-radius:.7rem;border:2px solid var(--brand-text);background:transparent;color:var(--brand-text);font-weight:700;padding:0 .75rem}
.add[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.best{margin-top:.6rem;display:flex;align-items:center;gap:.6rem;background:var(--best-bg);border-radius:.6rem;padding:.6rem .7rem;flex-wrap:wrap}
.price{font-family:var(--font-display);font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.tag{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--best)}
.tag::before{content:"\2713\00a0"}
.unit{font-size:.94rem;color:var(--ink);font-weight:600}
.was{font-size:.94rem;color:var(--muted);text-decoration:line-through}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:.4rem;color:#fff;font-weight:700;font-size:.88rem;white-space:nowrap}
.others{margin:.5rem 0 0;padding:0;list-style:none}
.others li{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem .1rem;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.others .p{font-weight:700;font-size:1.06rem}
.others .diff{color:var(--warn);font-weight:600;font-size:.94rem}
.old{color:var(--warn);font-weight:700;font-size:.88rem}
.h2{font-family:var(--font-display);font-size:1.65rem;margin:1.1rem 0 .25rem;font-weight:700}
.sub{color:var(--muted);margin:0 0 .6rem}
.seg{display:flex;gap:.5rem;margin:.6rem 0}
.seg button{flex:1;min-height:3rem;border-radius:.6rem;border:2px solid var(--line);background:var(--chip);font-weight:700;padding:0 .3rem}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.town{display:grid;grid-template-columns:1fr auto;gap:.25rem .7rem;padding:.7rem 0;border-top:1px solid var(--line)}
.town:first-child{border-top:0}
.town .name{font-weight:650;font-size:1.06rem}
.town .km{color:var(--muted);font-size:.94rem}
.town .tot{font-family:var(--font-display);font-weight:700;font-size:1.75rem;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/-1;height:.8rem;border-radius:.4rem;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted);border-radius:.4rem}
.town.cheap .bar i{background:var(--best)}
.li{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .n{flex:1;min-width:9rem}
.qty{display:flex;align-items:center;gap:.35rem}
.qty button{width:3rem;height:3rem;border-radius:.6rem;border:2px solid var(--line);background:var(--chip);font-size:1.3rem;font-weight:700}
.qty b{min-width:1.6rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.12rem}
.tot-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tot-row:first-child{border-top:0}
.tot-row.win{background:var(--best-bg);border-radius:.6rem;padding:.6rem .7rem;border:0;margin-top:.25rem}
.amt{font-family:var(--font-display);font-size:1.75rem;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem}
.btn{min-height:3rem;padding:0 1.05rem;border-radius:.7rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:.4rem}
.btn.alt{background:transparent;color:var(--brand-text);border-color:var(--brand-text)}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
pre{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.7rem;overflow-x:auto;font-size:.8rem;margin:.5rem 0}
.disclaimer{margin:1.4rem 0 0;padding:.7rem .8rem;border-left:4px solid var(--brand);background:var(--card);border-radius:.4rem;font-size:.94rem}
.chart{width:100%;height:auto;display:block;margin-top:.4rem}
.chart text{fill:var(--muted);font-size:14px;font-family:var(--font-body)}
.chart .grid-line{stroke:var(--line);stroke-width:1}
.legend{list-style:none;margin:.4rem 0 0;padding:0}
.legend li{display:flex;align-items:center;gap:.5rem;padding:.25rem 0}
.legend svg{flex:none}
.back{margin-top:.8rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:2px solid var(--line);
  padding:.35rem max(8px,env(safe-area-inset-right,0px)) calc(.35rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:40rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem}
nav.tabs button{min-height:3.4rem;border:0;background:transparent;border-radius:.6rem;font-weight:650;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
nav.tabs button svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--chip);box-shadow:inset 0 -3px 0 var(--brand)}
.cnt{font-size:.76rem;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 .45rem;margin-left:.25rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
/* --- Accounts, sessions and billing --- */
.meter{max-width:40rem;margin:.5rem auto 0;font-weight:700;font-size:.94rem;background:rgba(0,0,0,.22);border-radius:.5rem;padding:.35rem .6rem}
.hrow{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.hrow:first-child{border-top:0}
.hrow .n{flex:1;min-width:9rem}
.hrow .n b{font-weight:650;font-size:1.06rem;display:block}
.lookup{min-height:3rem;border-radius:.7rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;padding:0 .9rem}
.field{display:block;margin:.8rem 0}
.field span{display:block;font-weight:650;margin-bottom:.25rem}
.field input{width:100%;min-height:3.2rem;padding:.5rem .8rem;border-radius:.6rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-size:1.12rem}
.field input.big{font-size:1.5rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.check{display:flex;gap:.7rem;align-items:flex-start;margin:.9rem 0;min-height:3rem}
.check input{width:1.7rem;height:1.7rem;flex:none;margin-top:.15rem;accent-color:var(--brand)}
.err{color:var(--warn);font-weight:700;min-height:1.4rem;margin:.4rem 0}
.wide{width:100%}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn[disabled],.lookup[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand-text);font-weight:700;text-decoration:underline;min-height:3rem;padding:0 .2rem}
.hero{text-align:center;padding:1.2rem 0 .4rem}
.hero .big{font-family:var(--font-display);font-size:1.75rem;font-weight:700;line-height:1.15;margin:0 0 .4rem}
.points{margin:.6rem 0;padding:0;list-style:none}
.points li{padding:.35rem 0 .35rem 1.8rem;position:relative}
.points li::before{content:"\2713";position:absolute;left:.2rem;color:var(--best);font-weight:800}
.plan{border:2px solid var(--best);background:var(--best-bg)}
.plan .amt{display:block}
.steps{margin:.5rem 0;padding-left:1.4rem}
.steps li{padding:.3rem 0}
dialog{border:0;border-radius:1rem;padding:1.1rem;max-width:min(34rem,calc(100vw - 2rem));width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 .5rem;font-family:var(--font-display);font-size:1.55rem}
body.plainhead .where,body.plainhead .search,body.plainhead .meter,body.plainhead .fresh,body.plainhead nav.tabs{display:none}
</style>
</head>
<body class="plainhead">
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
<header>
  <div class="row">
    <h1>PricePulse ZA</h1>
    <div class="where">
      <label for="base">Town</label>
      <select id="base"></select>
      <button class="locbtn" id="locate" type="button" aria-label="Use my location to choose the nearest town">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search a product, e.g. milk" aria-label="Search products" autocomplete="off" enterkeyhint="search"></div>
  <div class="meter" id="meter"></div>
  <div class="fresh" id="fresh"></div>
</header>
<div id="status" class="vh" role="status" aria-live="polite"></div>
<main id="main" tabindex="-1"><p class="empty">Opening PricePulse&hellip;</p></main>
</div>
<nav class="tabs" aria-label="Main"><div class="in" id="nav"></div></nav>
<dialog id="dlg" aria-labelledby="dlgt"></dialog>

<script>
"use strict";
/* ---------- Settings and constants ---------- */
var CFG = window.PRICEPULSE_CONFIG || {};
var API = String(CFG.apiBase || "").replace(/\/+$/, "") + "/api/v1";
var SUPPORT = CFG.supportEmail || "admin@trolleyup.com";
var TROLLEYUP_URL = "https://trolleyup.com";
var STALE_HOURS = 48;
var DISCLAIMER = "Prices are collected from public retailer websites and may differ in store. Always check at the till.";
var STORES = {"Checkers":"#0a6e8a","Pick n Pay":"#1d4fa3","Woolworths":"#2b2b2b",
  "Ultra Liquors":"#6b2fa0","Liquorland":"#8a5100","Dis-Chem":"#17703a"};
var STORES_DARK={"Checkers":"#6fd0f0","Pick n Pay":"#9dbbff","Woolworths":"#e8e8e8","Ultra Liquors":"#d4a8ff","Liquorland":"#ffc56b","Dis-Chem":"#86e8a8"};
var DASHES = ["", "6 4", "2 3", "10 3 2 3", "1 4", "12 6"];
var CATS = ["All","Groceries","Fresh","Liquor","Health & Beauty"];
/* Used until the server's list arrives. Location never leaves the phone. */
var FALLBACK_REGIONS = [
  {slug:"paarl",name:"Paarl",lat:-33.7342,lon:18.9621},{slug:"wellington",name:"Wellington",lat:-33.6393,lon:19.0112},
  {slug:"franschhoek",name:"Franschhoek",lat:-33.9133,lon:19.1169},{slug:"stellenbosch",name:"Stellenbosch",lat:-33.9321,lon:18.8602},
  {slug:"cape-town",name:"Cape Town",lat:-33.9249,lon:18.4241},{slug:"worcester",name:"Worcester",lat:-33.6461,lon:19.4485},
  {slug:"hermanus",name:"Hermanus",lat:-34.4187,lon:19.2345}];

var state = {
  phase:"boot",            /* boot, signin, idcheck, app */
  view:"find", productId:null, cat:"All", q:"", region:"paarl", regions:FALLBACK_REGIONS.slice(),
  me:null, items:[], basket:null, stamp:null, isSample:false, savedAt:null, offline:false, error:"",
  found:null, finding:false, findErr:"", unitMode:false, radius:50, towns:null, detail:null, theme:"system",
  signMode:"in", authErr:"", busy:false
};

/* ---------- Small helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(v){var p=Number(v).toFixed(2).split(".");return "R "+p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ")+"."+p[1]}
function say(msg){var el=document.getElementById("status");el.textContent="";setTimeout(function(){el.textContent=msg},50)}
function storeColor(s){
  if(STORES[s])return STORES[s];
  var c=["#7a4a00","#006b6b","#8a2b5a","#3d5a1a"],h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return c[Math.abs(h)%c.length];
}
function storeColorOn(s){return document.documentElement.dataset.dark==="1"?(STORES_DARK[s]||"#f7eeee"):storeColor(s)}
function badge(s){return '<span class="badge" style="background:'+storeColor(s)+'">'+esc(s)+'</span>'}
function regionName(slug){var r=state.regions.find(function(x){return x.slug===slug});return r?r.name:slug}
function haversine(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function toDate(s){if(!s)return null;if(s instanceof Date)return s;var d=new Date(s);return isNaN(d)?null:d}
function fmtDate(d){d=toDate(d);if(!d)return "";
  return d.toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Africa/Johannesburg"}).replace(" at ",", ")}
function fmtDay(d){return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric",timeZone:"Africa/Johannesburg"})}
function hoursOld(d){d=toDate(d);return d?(Date.now()-d.getTime())/36e5:0}
function plural(n,w){return n+" "+w+(n===1?"":"s")}

/* ---------- Sign-in. Same accounts as TrolleyUp (Firebase). "dev" mode is for local testing only. ---------- */
var Auth=(function(){
  var mode=CFG.authMode||"firebase",fbP=null,devName=null,fbUser=null;
  function fb(){
    if(!fbP){
      var base="https://www.gstatic.com/firebasejs/10.14.1/";
      fbP=Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")]).then(function(m){
        var auth=m[1].getAuth(m[0].initializeApp(CFG.firebase));return {Au:m[1],auth:auth};
      });
      fbP.catch(function(){fbP=null});
    }
    return fbP;
  }
  function plain(e){
    var c=(e&&e.code)||"";
    if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return "That email or password is not right. Please check and try again.";
    if(/email-already-in-use/.test(c))return "That email already has an account. Tap “I already have an account” to sign in.";
    if(/weak-password/.test(c))return "Please choose a password of at least 6 characters.";
    if(/popup-closed|cancelled-popup/.test(c))return "The Google window was closed before sign-in finished. Please try again.";
    if(/popup-blocked/.test(c))return "Your browser blocked the Google window. Allow pop-ups for this site, or use email and password.";
    if(/network-request-failed/.test(c))return "No connection. Check your internet and try again.";
    if(/too-many-requests/.test(c))return "Too many tries. Please wait a few minutes and try again.";
    if(/unauthorized-domain/.test(c))return "Sign-in is not switched on for this web address yet. Please tell "+SUPPORT+".";
    return "Sign-in did not work. Please try again."+(c?" ("+c+")":"");
  }
  function wrap(p){return p.catch(function(e){throw new Error(plain(e))})}
  return {
    mode:mode,
    /* Calls back with true/false whenever sign-in changes. Rejects if sign-in could not load (offline). */
    start:function(cb){
      if(mode==="dev"){devName=load("pp_dev_user");cb(!!devName);return Promise.resolve()}
      return fb().then(function(f){f.Au.onAuthStateChanged(f.auth,function(u){fbUser=u&&!u.isAnonymous?u:null;cb(!!fbUser)})});
    },
    token:function(){
      if(mode==="dev")return Promise.resolve(devName?"dev:"+devName:null);
      return fbUser?fbUser.getIdToken():Promise.resolve(null);
    },
    email:function(){return mode==="dev"?(devName||""):(fbUser&&fbUser.email)||""},
    google:function(){return wrap(fb().then(function(f){return f.Au.signInWithPopup(f.auth,new f.Au.GoogleAuthProvider())}))},
    emailIn:function(e,p){return wrap(fb().then(function(f){return f.Au.signInWithEmailAndPassword(f.auth,e,p)}))},
    emailNew:function(e,p){return wrap(fb().then(function(f){return f.Au.createUserWithEmailAndPassword(f.auth,e,p)}))},
    reset:function(e){return wrap(fb().then(function(f){return f.Au.sendPasswordResetEmail(f.auth,e)}))},
    dev:function(name){devName=name;store("pp_dev_user",name);onAuth(true)},
    out:function(){
      if(mode==="dev"){devName=null;drop("pp_dev_user");onAuth(false);return Promise.resolve()}
      return fb().then(function(f){return f.Au.signOut(f.auth)});
    }
  };
})();

/* ---------- Talking to the price server ---------- */
function api(method,path,body){
  return Auth.token().then(function(tok){
    var ctl=typeof AbortController!=="undefined"?new AbortController():null;
    var timer=setTimeout(function(){if(ctl)ctl.abort()},15000);
    var opts={method:method,headers:{}};
    if(ctl)opts.signal=ctl.signal;
    if(tok)opts.headers.Authorization="Bearer "+tok;
    if(body!==undefined){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body)}
    return fetch(API+path,opts).then(function(r){
      clearTimeout(timer);
      var type=r.headers.get("content-type")||"";
      if(r.ok&&type.indexOf("json")<0)return r;
      return r.json().catch(function(){return {}}).then(function(b){
        if(r.ok)return b;
        var d=b.detail,e=new Error((d&&d.message)||(typeof d==="string"?d:"")||(Array.isArray(d)?"Please check what you typed and try again.":"The price server answered with error "+r.status+"."));
        e.status=r.status;e.code=(d&&d.code)||"";throw e;
      });
    },function(){clearTimeout(timer);var e=new Error(navigator.onLine===false?"You are offline.":"Could not reach the price server.");e.code="network";throw e});
  });
}
function qs(o){return Object.keys(o).filter(function(k){return o[k]!==""&&o[k]!=null}).map(function(k){return k+"="+encodeURIComponent(o[k])}).join("&")}

/* ---------- Data: product = {id,name,brand,size,cat,prices:{store:{price,promo,url,at,stale,unit}}} ---------- */
function eff(p){return p.promo!=null?p.promo:p.price}
function sortedStores(prod){return Object.keys(prod.prices).sort(function(a,b){return eff(prod.prices[a])-eff(prod.prices[b])||(a<b?-1:1)})}
function toProduct(it){
  var prices={};it.prices.forEach(function(p){prices[p.store]={price:p.price,promo:p.promo_price,url:p.url,at:p.scraped_at,stale:p.stale,unit:p.unit_price}});
  return {id:it.id,name:it.name,brand:it.brand,size:it.size,cat:it.category,prices:prices};
}
function applySession(s,fromCache){
  state.me=s.me;state.basket=s.basket;state.stamp=s.scraped_at;state.isSample=!!s.sample;
  state.items=s.items.map(function(i){return {q:i.quantity,on:i.on_list,p:toProduct(i.product)}});
  if(!fromCache){state.offline=false;state.error="";state.savedAt=new Date().toISOString();
    store("pp_session_"+state.region,{s:s,savedAt:state.savedAt})}
  state.towns=null;
}
function findItem(id){return state.items.find(function(i){return i.p.id===id})}
function onList(){return state.items.filter(function(i){return i.on})}
function loadSession(){
  return api("GET","/session?"+qs({region:state.region})).then(function(s){applySession(s);render()}).catch(function(e){
    if(handleAuthError(e))return;
    var c=load("pp_session_"+state.region);
    state.offline=true;state.error=e.message;
    if(c&&c.s){applySession(c.s,true);state.savedAt=c.savedAt}
    render();say(e.message+(c?" Showing saved prices.":""));
  });
}
function loadRegions(){
  return fetch(API+"/regions").then(function(r){return r.json()}).then(function(rs){
    if(Array.isArray(rs)&&rs.length){state.regions=rs;store("pp_regions",rs);fillRegions()}
  }).catch(function(){});
}
function handleAuthError(e){
  if(e.status===401){say("Please sign in again.");Auth.out();return true}
  return false;
}

/* ---------- Header lines shown on every screen ---------- */
function meterText(){
  var m=state.me;if(!m)return "";
  var s=m.session,items=s.active?s.items_used+" of "+s.items_max+" items looked up":"No session open";
  if(m.plan==="paid")return "Unlimited plan · "+items;
  var n=m.sessions_per_day;
  if(s.active)return "Session "+m.sessions_used_today+" of "+n+" today · "+items;
  var left=Math.max(0,n-m.sessions_used_today);
  return left?plural(left,"free session")+" left today":"No free sessions left today";
}
function newestPrice(){var n=null;state.items.forEach(function(i){for(var s in i.p.prices){var d=toDate(i.p.prices[s].at);if(d&&(!n||d>n))n=d}});return n}
function oldestPrice(){var o=null;state.items.forEach(function(i){for(var s in i.p.prices){var d=toDate(i.p.prices[s].at);if(d&&(!o||d<o))o=d}});return o}
function renderHead(){
  document.body.classList.toggle("plainhead",state.phase!=="app");
  document.getElementById("meter").textContent=meterText();
  var n=newestPrice();
  document.getElementById("fresh").textContent=n?"Prices updated "+fmtDate(n):"";
}
function banners(){
  var h="";
  if(state.offline)h+='<div class="banner warn" role="note"><b>'+(state.savedAt&&state.items.length?'Showing saved prices from '+esc(fmtDate(state.savedAt))+'.':'No connection.')+'</b>'+esc(state.error||"You are offline.")+' You can read your list, but looking up new items needs a connection.</div>';
  if(state.isSample)h+='<div class="banner warn" role="note"><b>Example prices.</b>The price server is running with test data, not real shelf prices.</div>';
  var o=oldestPrice();
  if(o&&hoursOld(o)>STALE_HOURS)h+='<div class="banner warn" role="note"><b>Some prices are more than 2 days old.</b>They are marked "Old price". Check at the till.</div>';
  return h;
}
function disclaimer(){return '<p class="disclaimer">'+DISCLAIMER+'</p>'}
function oldTag(r){return r.at&&hoursOld(r.at)>STALE_HOURS?' <span class="old">Old price ('+esc(fmtDate(r.at))+')</span>':''}

/* ---------- Find: search products, then look up prices ---------- */
var findTimer=null;
function runFind(now){
  clearTimeout(findTimer);
  findTimer=setTimeout(function(){
    var key=state.region+"|"+state.cat+"|"+state.q;
    state.finding=true;state.findErr="";
    api("GET","/catalogue?"+qs({region:state.region,q:state.q.trim(),category:state.cat==="All"?"":state.cat,limit:50})).then(function(r){
      if(key!==state.region+"|"+state.cat+"|"+state.q)return;
      state.finding=false;state.found=r;if(state.view==="find")renderMain();
    }).catch(function(e){
      if(handleAuthError(e))return;
      state.finding=false;state.findErr=e.message;if(state.view==="find")renderMain();
    });
  },now?0:350);
}
function priceUnit(p,row){return row.unit||null}
function viewFind(){
  var cats=CATS.filter(function(c){return c!=="Liquor"||(state.me&&state.me.adult)});
  var h=banners();
  h+='<div class="pills" role="group" aria-label="Category">'+cats.map(function(c){
    return '<button class="pill" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(state.cat===c)+'">'+esc(c)+'</button>'}).join("")+'</div>';
  h+='<div class="seg" role="group" aria-label="Show prices as"><button type="button" data-unit="0" aria-pressed="'+!state.unitMode+'">Pack price</button><button type="button" data-unit="1" aria-pressed="'+state.unitMode+'">Per 100g / 100ml</button></div>';
  if(state.findErr)return h+'<div class="empty">'+esc(state.findErr)+' <button class="linkbtn" type="button" data-act="refind">Try again</button></div>'+disclaimer();
  var f=state.found;
  if(!f)return h+'<p class="sub" aria-busy="true">Loading products…</p>'+disclaimer();
  if(!f.items.length)return h+'<div class="empty">'+esc(f.note||"No products match.")+'</div>'+disclaimer();
  h+='<p class="sub">'+plural(f.total,"product")+(f.total>f.items.length?' (showing the first '+f.items.length+'; type more of the name to narrow it down)':'')+'. Tap <b>Look up price</b> to compare stores.</p><div class="grid">';
  h+=f.items.map(function(c){
    var it=findItem(c.id);
    if(it)return card(it);
    return '<article class="card"><div class="hrow"><div class="n"><b>'+esc(c.name)+'</b><span class="size">'+esc(c.size)+' · at '+plural(c.store_count,"store")+'</span></div>'+
      '<button class="lookup" type="button" data-look="'+c.id+'" aria-label="Look up price of '+esc(c.name)+' '+esc(c.size)+'">Look up price</button></div></article>';
  }).join("")+'</div>';

function card(it){
  var p=it.p,stores=sortedStores(p);
  var head='<div class="top"><div style="min-width:0"><h3 id="p'+p.id+'" tabindex="-1"><a href="#product/'+p.id+'">'+esc(p.name)+'</a></h3><div class="size">'+esc(p.size)+'</div></div>'+
    '<button class="add" type="button" data-toggle="'+p.id+'" aria-pressed="'+it.on+'" aria-label="'+(it.on?'Take '+esc(p.name)+' off my list':'Put '+esc(p.name)+' on my list')+'">'+(it.on?'On list':'+ List')+'</button></div>';
  if(!stores.length)return '<article class="card">'+head+'<div class="size" style="margin-top:.5rem">No store in '+esc(regionName(state.region))+' has a price for this right now.</div></article>';
  var b=stores[0],bp=p.prices[b],others=stores.slice(1),u=priceUnit(p,bp);
  var main=state.unitMode&&u?money(u.value):money(eff(bp));
  var second=state.unitMode&&u?money(eff(bp))+' for '+esc(p.size):(u?money(u.value)+' '+esc(u.unit):'');
  return '<article class="card">'+head+
    '<div class="best"><div><div class="tag">Best price</div><div class="price">'+main+(state.unitMode&&u?' <span class="unit">'+esc(u.unit)+'</span>':'')+'</div>'+
    (second?'<div class="unit">'+second+'</div>':'')+(bp.promo!=null?'<div class="was">Usually '+money(bp.price)+'</div>':'')+oldTag(bp)+'</div>'+badge(b)+'</div>'+
    (others.length?'<ul class="others">'+others.map(function(s){
      var r=p.prices[s],uu=priceUnit(p,r);
      var shown=state.unitMode&&uu?money(uu.value)+' '+esc(uu.unit):money(eff(r));
      var diff=state.unitMode&&uu?'':' <span class="diff">'+money(eff(r)-eff(bp))+' more</span>';
      return '<li><span>'+badge(s)+'</span><span><span class="p">'+shown+'</span>'+diff+oldTag(r)+'</span></li>'}).join("")+'</ul>':
      '<div class="size" style="margin-top:.5rem">Only one store has this item.</div>')+'</article>';
}
function lookUp(id){
  if(state.busy)return;state.busy=true;
  api("POST","/session/items",{product_id:id,region:state.region}).then(function(s){
    state.busy=false;applySession(s);render();
    var it=findItem(id),h=document.getElementById("p"+id);if(h)h.focus({preventScroll:true});
    if(it){var st=sortedStores(it.p);say(it.p.name+(st.length?": best price "+money(eff(it.p.prices[st[0]]))+" at "+st[0]:": no price right now")+". "+meterText()+".")}
  }).catch(function(e){
    state.busy=false;
    if(handleAuthError(e))return;
    if(e.code==="daily_limit")return upgradeDialog(e.message);
    if(e.code==="session_full")return ask("This session is full",'<p>'+esc(e.message)+'</p><p>Your list stays until you clear it. Clearing starts a new session.</p>',[["Go to my list","golist","btn"],["Close","","btn alt"]]);
    if(e.code==="id_required"){state.phase="idcheck";return render()}
    say(e.message);ask("Could not look that up",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]]);
  });
}

/* Hand-drawn SVG line chart. Lines differ by dash pattern as well as colour; the legend states each latest price. */
function chart(history){
  var series=(history||[]).filter(function(s){return s.points.length});
  if(!series.length)return '<p class="sub">No history yet. It builds up as prices are checked each day.</p>';
  var dates={},vals=[];
  series.forEach(function(s){s.points.forEach(function(pt){dates[pt.date]=1;vals.push(pt.price)})});
  var ds=Object.keys(dates).sort();
  if(ds.length<2)return '<p class="sub">Only one day of prices so far. The chart appears after the next price check.</p>'+legend(series);
  var W=360,H=220,L=62,R=10,T=12,B=30,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max===min){max+=1;min=Math.max(0,min-1)}
  var t0=new Date(ds[0]).getTime(),t1=new Date(ds[ds.length-1]).getTime();
  function x(d){return L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R)}
  function y(v){return T+(max-v)/(max-min)*(H-T-B)}
  var g='';
  [min,(min+max)/2,max].forEach(function(v){g+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">R'+v.toFixed(2)+'</text>'});
  function day(d){return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short"})}
  g+='<text x="'+L+'" y="'+(H-8)+'">'+esc(day(ds[0]))+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(day(ds[ds.length-1]))+'</text>';
  series.forEach(function(s,i){
    var pts=s.points.map(function(pt){return x(pt.date).toFixed(1)+","+y(pt.price).toFixed(1)}).join(" ");
    g+='<polyline fill="none" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-linejoin="round" stroke-dasharray="'+DASHES[i%DASHES.length]+'" points="'+pts+'"/>';
    var last=s.points[s.points.length-1];g+='<circle cx="'+x(last.date)+'" cy="'+y(last.price)+'" r="4" fill="'+storeColorOn(s.store)+'"/>';
  });
  var summary=series.map(function(s){var a=s.points[0].price,z=s.points[s.points.length-1].price;
    return s.store+" went from R"+a.toFixed(2)+" to R"+z.toFixed(2)}).join("; ");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Price history: '+esc(summary)+'">'+g+'</svg>'+legend(series);
}
function legend(series){
  return '<ul class="legend">'+series.map(function(s,i){var last=s.points[s.points.length-1];
    return '<li><svg width="36" height="12" aria-hidden="true"><line x1="0" x2="36" y1="6" y2="6" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-dasharray="'+DASHES[i%DASHES.length]+'"/></svg>'+badge(s.store)+' <span>now '+money(last.price)+'</span></li>'}).join("")+'</ul>';
}

/* ---------- Towns ---------- */
function viewTowns(){
  var h=banners()+'<h2 class="h2">Town by town</h2><p class="sub">What your list costs in each town near '+esc(regionName(state.region))+', buying each item at that town’s cheapest store.</p>';
  h+='<div class="seg" role="group" aria-label="Distance">'+[25,50,100].map(function(k){return '<button type="button" data-radius="'+k+'" aria-pressed="'+(state.radius===k)+'">'+k+' km</button>'}).join("")+'</div>';
  if(state.offline)return h+'<div class="empty">Comparing towns needs a connection.</div>'+disclaimer();
  if(!onList().length)return h+'<div class="empty">Your list is empty. Look up products on the Find tab first.</div>'+disclaimer();
  var t=state.towns,k=townsKey();
  if(!t||t.key!==k)return h+'<p class="sub" aria-busy="true">Working out town totals…</p>'+disclaimer();
  if(t.error)return h+'<div class="empty">'+esc(t.error)+'</div>'+disclaimer();
  var d=t.data,rows=d.towns.filter(function(x){return x.total!=null});
  if(d.note)h+='<div class="banner" role="note">'+esc(d.note)+'</div>';
  if(!rows.length)return h+'<div class="empty">No town within '+state.radius+' km has prices yet.</div>'+disclaimer();
  var max=Math.max.apply(null,rows.map(function(r){return r.total}));
  h+='<div class="card">'+rows.map(function(r,i){
    var cheap=i===0&&rows.length>1;
    return '<div class="town'+(cheap?' cheap':'')+'"><div><div class="name">'+esc(r.name)+(cheap?' <span class="tag">Cheapest</span>':'')+'</div><div class="km">'+(r.distance_km<1?'Your town':Math.round(r.distance_km)+' km away')+
      (r.items_missing?' · '+plural(r.items_missing,"item")+' not priced here':'')+'</div></div><div class="tot">'+money(r.total)+'</div><div class="bar" aria-hidden="true"><i style="width:'+Math.max(8,Math.round(r.total/max*100))+'%"></i></div></div>'}).join("")+'</div>';
  var none=d.towns.filter(function(x){return x.total==null}).map(function(x){return x.name});
  if(none.length)h+='<p class="sub" style="margin-top:.6rem">No prices yet for: '+esc(none.join(", "))+'.</p>';

    var lat=pos.coords.latitude,lon=pos.coords.longitude,best=null;
    state.regions.forEach(function(r){var d=haversine(lat,lon,r.lat,r.lon);if(!best||d<best.d)best={r:r,d:d}});
    if(!best)return;

    say("Nearest town: "+best.r.name+", about "+Math.round(best.d)+" km away."+(best.d>80?" That is far; you can choose another town from the list.":""));
  },function(err){
    say(err.code===1?"Location is blocked for this app. Choose your town from the list instead.":"Could not find your location. Choose your town from the list instead.");

function onAuth(signedIn){

  api("GET","/me").then(function(m){
    state.me=m;

    enterApp();
  }).catch(function(e){
    if(e.status===401){state.phase="signin";state.authErr=e.message;return render()}
    /* Server unreachable: show the saved list if there is one. */

    if(c&&c.s){state.phase="app";state.offline=true;state.error=e.message;applySession(c.s,true);state.savedAt=c.savedAt;state.view="list";return render()}
    state.phase="signin";state.authErr=e.message+" Please try again when you have a connection.";render();
  });

    if(d.dec&&i2.q<=1)return void setItem(i2.p.id,{on_list:false}).then(function(){say(i2.p.name+" taken off your list.")});
    var nq=Math.min(99,i2.q+(d.inc?1:-1));
    return void setItem(i2.p.id,{quantity:nq}).then(function(){var b=document.querySelector('[data-'+(d.inc?'inc':'dec')+'="'+i2.p.id+'"]');if(b)b.focus();say(i2.p.name+": "+nq)});
  }
  switch(d.act){
    case "google":return void Auth.google().catch(function(er){formState(document.getElementById("emailform"),false,er.message)});
    case "mode-in":state.signMode="in";state.authErr="";return renderMain();
    case "mode-new":state.signMode="new";state.authErr="";return renderMain();
    case "forgot":{
      var em=(document.querySelector('#emailform [name=email]')||{}).value||"";
      var ef=document.getElementById("emailform");
      if(!em)return formState(ef,false,"Type your email address above first, then tap Forgot password.");
      return void Auth.reset(em).then(function(){formState(ef,false,"We sent a password reset email to "+em+". Open it, choose a new password, then sign in here.")},function(er){formState(ef,false,er.message)});
    }
    case "signout":return void Auth.out();
    case "refind":state.findErr="";return runFind(true);
    case "share":return shareList();
    case "export":return exportDialog();
    case "clear":return clearSession();
    case "upgrade":return upgrade();
    case "refresh":return void refreshMe().then(function(m){say(m.plan==="paid"?"Your Unlimited plan is active.":"Not paid yet.")});
    case "cancelplan":return ask("Cancel your plan?",'<p>No more payments will be taken. You keep unlimited sessions until the end of the month you have paid for, then go back to the free plan.</p>',[["Cancel my plan","docancel","btn"],["Keep my plan","","btn alt"]]);
    case "delete":return ask("Delete your PricePulse data?",'<p>This removes your age check, your sessions and your list from PricePulse. It does not delete your sign-in, which you also use for TrolleyUp.</p>',[["Delete my data","dodelete","btn"],["Keep it","","btn alt"]]);
  }
});
/* Forms keep what was typed when something goes wrong: only the message and button change. */
function formState(f,busy,msg){
  var b=f.querySelector("button.btn"),er=f.querySelector(".err");
  if(b)b.disabled=!!busy;
  if(er&&msg!==undefined)er.textContent=msg;
  if(msg)say(msg);
}
document.addEventListener("submit",function(e){
  var f=e.target;e.preventDefault();
  if(f.id==="devform")return Auth.dev(f.querySelector("[name=name]").value.trim());
  if(f.id==="emailform"){
    formState(f,true,"");
    var em=f.email.value.trim(),pw=f.password.value;
    (state.signMode==="new"?Auth.emailNew(em,pw):Auth.emailIn(em,pw)).catch(function(er){formState(f,false,er.message)});
    return;
  }
  if(f.id==="idform"){
    formState(f,true,"");
    api("POST","/me/verify-id",{id_number:f.idnum.value,accept_terms:f.terms.checked}).then(function(m){
      state.me=m;say(m.adult?"Thank you. Your age is confirmed.":"Thank you. Liquor is hidden because you are under 18.");enterApp();
    }).catch(function(er){if(handleAuthError(er))return;formState(f,false,er.message);f.idnum.focus()});
  }
});
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value;
  if(state.view!=="find"){state.view="find";try{history.replaceState(null,"","#find")}catch(x){}renderNav()}
  runFind();
});
document.getElementById("base").addEventListener("change",function(e){setRegion(e.target.value)});
document.getElementById("locate").addEventListener("click",locate);
window.addEventListener("popstate",function(){go((location.hash||"#find").slice(1),false)});
window.addEventListener("online",function(){if(state.phase==="app"&&state.offline)loadSession()});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(state.theme==="system")render()});

/* ---------- Start ---------- */
(function init(){
  state.region=load("pp_region")||"paarl";state.unitMode=!!load("pp_unit");state.theme=load("pp_theme")||"system";
  var rs=load("pp_regions");if(Array.isArray(rs)&&rs.length)state.regions=rs;
  fillRegions();render();loadRegions();
  Auth.start(onAuth).catch(function(){
    /* Sign-in could not load (no connection). Show the saved list if there is one. */
    var c=load("pp_session_"+state.region);
    if(c&&c.s){state.phase="app";state.offline=true;state.error="You are offline.";applySession(c.s,true);state.savedAt=c.savedAt;state.view="list";return render()}
    state.phase="signin";state.authErr="No connection. PricePulse needs the internet to sign you in.";render();
  });
  var secure=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if("serviceWorker" in navigator&&secure)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
