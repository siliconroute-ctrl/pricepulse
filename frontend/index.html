<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PricePulse ZA</title>
<meta name="description" content="Compare grocery, liquor and pharmacy prices across South African stores.">
<meta name="theme-color" content="#b00d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="config.js"></script>
<style>
/* Layout: phone-first app shell. Sticky red header, scrolling content, fixed bottom nav.
   Sizes are in rem so the app follows the phone's text-size setting (1rem = 17px by default). */
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#000000; --muted:#4a5a63; --line:#d1d7db;
  --brand:#b00d27; --brand-ink:#ffffff; --brand-text:#b00d27; --best:#08532a; --best-bg:#e1f2e6; --warn:#7a4f00; --warn-bg:#fff3d6;
  --item:#000000; --chip:#e4e0d8; --chip-on:#000000; --chip-on-ink:#ffffff; --focus:#000000;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --item:#f7eeee; --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --item:#f7eeee; --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 7rem max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:8px;z-index:50;background:var(--card);padding:.5rem 1rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:40rem;margin:0 auto}
header{position:sticky;top:0;z-index:10;background:var(--bg);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
header .apptop{background:var(--brand);color:var(--brand-ink);
  padding:calc(.2rem + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) .45rem max(16px,env(safe-area-inset-left,0px))}
header .findbar{padding:.45rem max(16px,env(safe-area-inset-right,0px)) .4rem max(16px,env(safe-area-inset-left,0px))}
header .apptop :focus-visible{outline-color:#fff}
header .row{max-width:40rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
h1{font-family:var(--font-display);font-size:1.55rem;line-height:1;margin:0;font-weight:700}
.find-row{align-items:stretch;justify-content:flex-start}
.homelink{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:3rem}
header .search-row{margin-top:.6rem}
.find-row select{flex:1 1 auto;width:auto;max-width:14rem;background:var(--card);color:var(--ink);border:2px solid var(--muted);border-radius:.5rem;padding:.3rem .4rem;min-height:3rem;font-weight:600}
.locbtn{flex:none;min-height:3rem;min-width:3rem;border-radius:.5rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-weight:700;padding:0;display:inline-flex;align-items:center;justify-content:center}
.locbtn svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2}
.search{flex:1;min-width:0}
.search input{width:100%;min-height:3rem;padding:.5rem .7rem;border-radius:.6rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-size:1.06rem}
.banner{border-radius:.6rem;padding:.3rem .6rem;margin:.4rem 0;border:2px solid var(--line);background:var(--card);line-height:1.3}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)}
.banner b{display:inline;margin-right:.3rem}
.pills{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 0 .3rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:3rem;padding:.4rem 1rem;border-radius:999px;border:2px solid var(--line);background:var(--chip);font-weight:600}
.pill[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.grid{display:flex;flex-direction:column;gap:.85rem;margin-top:.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.85rem;padding:.85rem;min-width:0}
.card h3{margin:0;font-size:1.12rem;line-height:1.25;font-weight:650;color:var(--item)}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.size{color:var(--muted);font-size:.94rem}
.pic{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:.5rem;flex:none}
.pic.big{width:min(100%,240px);height:auto;max-height:240px}
.top{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}
.add{flex:none;min-width:3rem;min-height:3rem;border-radius:.7rem;border:2px solid var(--brand-text);background:transparent;color:var(--brand-text);font-weight:700;padding:0 .75rem}
.add[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.best{margin-top:.6rem;display:flex;align-items:center;gap:.6rem;background:var(--best-bg);border-radius:.6rem;padding:.6rem .7rem;flex-wrap:wrap}
.price{font-family:var(--font-display);font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.tag{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--best)}
.tag::before{content:"\2713\00a0"}
.unit{font-size:.94rem;color:var(--ink);font-weight:600}
.was{font-size:.94rem;color:var(--muted);text-decoration:line-through}
.badge.blink{display:inline-flex;align-items:center;min-height:48px;text-decoration:none;padding:.2rem .8rem}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:.4rem;color:#fff;font-weight:700;font-size:.88rem;white-space:nowrap}
.others{margin:.5rem 0 0;padding:0;list-style:none}
.others li{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem .1rem;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.others .p{font-weight:700;font-size:1.06rem}
.others .diff{color:var(--warn);font-weight:600;font-size:.94rem}
.old{color:var(--warn);font-weight:700;font-size:.88rem}
.h2{font-family:var(--font-display);font-size:1.65rem;margin:1.1rem 0 .25rem;font-weight:700}
.sub{color:var(--muted);margin:0 0 .6rem}
.seg{display:flex;gap:.5rem;margin:.6rem 0}
.seg button{flex:1;min-height:3rem;border-radius:.6rem;border:2px solid var(--line);background:var(--chip);font-weight:700;padding:0 .3rem}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.town{display:grid;grid-template-columns:1fr auto;gap:.25rem .7rem;padding:.7rem 0;border-top:1px solid var(--line)}
.town:first-child{border-top:0}
.town .name{font-weight:650;font-size:1.06rem;color:var(--item)}
.town .km{color:var(--muted);font-size:.94rem}
.town .tot{font-family:var(--font-display);font-weight:700;font-size:1.75rem;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/-1;height:.8rem;border-radius:.4rem;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted);border-radius:.4rem}
.town.cheap .bar i{background:var(--best)}
.li{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .n{flex:1;min-width:9rem;color:var(--item)}
.qty{display:flex;align-items:center;gap:.35rem}
.qty button{width:3rem;height:3rem;border-radius:.6rem;border:2px solid var(--line);background:var(--chip);font-size:1.3rem;font-weight:700}
.qty b{min-width:1.6rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.12rem}
.tot-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex-wrap:nowrap}
.tot-row>:first-child{min-width:0;flex:1 1 auto}
.tot-row>:last-child{flex:none;margin-left:auto;text-align:right;white-space:nowrap}
.tot-row:first-child{border-top:0}
.tot-row.win{background:var(--best-bg);border-radius:.6rem;padding:.6rem .7rem;border:0;margin-top:.25rem}
.amt{font-family:var(--font-display);font-size:1.75rem;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem}
.btn{min-height:3rem;padding:0 1.05rem;border-radius:.7rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:.4rem}
.btn.alt{background:transparent;color:var(--brand-text);border-color:var(--brand-text)}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
pre{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.7rem;overflow-x:auto;font-size:.8rem;margin:.5rem 0}
.disclaimer{margin:1.4rem 0 0;padding:.7rem .8rem;border-left:4px solid var(--brand);background:var(--card);border-radius:.4rem;font-size:.94rem}
.chart{width:100%;height:auto;display:block;margin-top:.4rem}
.chart text{fill:var(--muted);font-size:14px;font-family:var(--font-body)}
.chart .grid-line{stroke:var(--line);stroke-width:1}
.legend{list-style:none;margin:.4rem 0 0;padding:0}
.legend li{display:flex;align-items:center;gap:.5rem;padding:.25rem 0}
.legend svg{flex:none}
.back{margin-top:.8rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--brand);border-top:2px solid var(--brand);
  padding:.35rem max(8px,env(safe-area-inset-right,0px)) calc(.35rem + max(env(safe-area-inset-bottom,0px),16px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:40rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem}
nav.tabs button{min-height:3.4rem;border:0;background:transparent;border-radius:.6rem;font-weight:650;font-size:.88rem;color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
nav.tabs button svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand-ink);background:rgba(255,255,255,.22);box-shadow:inset 0 -3px 0 #fff}
nav.tabs :focus-visible{outline-color:#fff}
nav.tabs .cnt{background:#fff;color:var(--brand)}
.cnt{font-size:.76rem;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 .45rem;margin-left:.25rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
/* --- Accounts, sessions and billing --- */
.hrow{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.hrow:first-child{border-top:0}
.hrow .n{flex:1;min-width:9rem}
.hrow .n b{font-weight:650;font-size:1.06rem;display:block;color:var(--item)}
.lookup{min-height:3rem;border-radius:.7rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;padding:0 .9rem}
.field{display:block;margin:.8rem 0}
.field span{display:block;font-weight:650;margin-bottom:.25rem}
.field input{width:100%;min-height:3.2rem;padding:.5rem .8rem;border-radius:.6rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-size:1.12rem}
.field input.big{font-size:1.5rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.check{display:flex;gap:.7rem;align-items:flex-start;margin:.9rem 0;min-height:3rem}
.check input{width:1.7rem;height:1.7rem;flex:none;margin-top:.15rem;accent-color:var(--brand)}
.err{color:var(--warn);font-weight:700;min-height:1.4rem;margin:.4rem 0}
.wide{width:100%}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn[disabled],.lookup[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand-text);font-weight:700;text-decoration:underline;min-height:3rem;padding:0 .2rem}
.hero{text-align:center;padding:1.2rem 0 .4rem}
.hero .big{font-family:var(--font-display);font-size:1.75rem;font-weight:700;line-height:1.15;margin:0 0 .4rem}
.points{margin:.6rem 0;padding:0;list-style:none}
.points li{padding:.35rem 0 .35rem 1.8rem;position:relative}
.points li::before{content:"\2713";position:absolute;left:.2rem;color:var(--best);font-weight:800}
.plan{border:2px solid var(--best);background:var(--best-bg)}
.plan .amt{display:block}
.steps{margin:.5rem 0;padding-left:1.4rem}
.steps li{padding:.3rem 0}
dialog{border:0;border-radius:1rem;padding:1.1rem;max-width:min(34rem,calc(100vw - 2rem));width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 .5rem;font-family:var(--font-display);font-size:1.55rem}
/* Three-dot menu (top right of every screen): a stacked drop-down list on the right of the screen */
.menubtn{flex:none;width:3rem;height:3rem;min-width:3rem;border:0;border-radius:.6rem;background:transparent;color:var(--nav-ink,var(--brand-ink));display:inline-flex;align-items:center;justify-content:center}
.menubtn svg{width:1.7rem;height:1.7rem;fill:currentColor}
.menubtn[aria-expanded="true"]{background:var(--nav-tint,rgba(255,255,255,.22))}
header .row.top{flex-wrap:nowrap}
.menupop{position:fixed;right:max(.5rem,env(safe-area-inset-right,0px));top:4rem;z-index:40;width:min(19rem,calc(100vw - 1rem));overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:.7rem;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:.15rem 0}
.menupop[hidden]{display:none}
.menupop :focus-visible{outline-color:var(--focus);outline-offset:-3px}
.menupop .mi{display:flex;align-items:center;width:100%;min-height:48px;padding:0 1rem;border:0;background:transparent;color:var(--ink);font-size:1.03rem;font-weight:600;text-align:left;text-decoration:none;cursor:pointer;line-height:1.2}
.menupop .mi:hover,.menupop .mi:focus-visible{background:var(--chip)}
.menupop hr{border:0;border-top:1px solid var(--line);margin:0}
.menupop[data-phase]:not([data-phase="app"]) [data-needs="user"]{display:none}
/* How PricePulse works: a chat, like WhatsApp */
dialog.how{padding:0;max-width:min(34rem,100vw);width:100%;height:min(46rem,100dvh);max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:.8rem}
dialog.how:not([open]){display:none}
.how .hhead{flex:none;display:flex;align-items:center;gap:.5rem;background:var(--brand);color:var(--brand-ink);padding:.4rem .6rem}
.how .hhead h2{margin:0;font-size:1.35rem;flex:1}
.how .hhead button{min-height:3rem;min-width:3rem;border:0;background:transparent;color:inherit;font-size:1.05rem;font-weight:700;border-radius:.6rem}
.how .hhead :focus-visible{outline-color:#fff}
.how .chat{flex:1;overflow-y:auto;padding:.8rem .7rem 1rem;background:#f7f4ee;color:#1d1415;display:flex;flex-direction:column;gap:.5rem}
.how .bub{max-width:88%;padding:.55rem .8rem;border-radius:.2rem .9rem .9rem .9rem;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.15);font-size:1.03rem;line-height:1.4}
.how .bub.me{align-self:flex-end;background:#d9fdd3;border-radius:.9rem .2rem .9rem .9rem}
.how .bub b{font-weight:700}
.how .bub small{display:block;margin-top:.25rem;font-size:.86rem;color:#4d4243}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .how .chat{background:#0d1418;color:#f7eeee}
  :root:not([data-theme="light"]) .how .bub{background:#1f2c34;color:#f7eeee}
  :root:not([data-theme="light"]) .how .bub.me{background:#005c4b}
  :root:not([data-theme="light"]) .how .bub small{color:#cdbdbe}}
:root[data-theme="dark"] .how .chat{background:#0d1418;color:#f7eeee}
:root[data-theme="dark"] .how .bub{background:#1f2c34;color:#f7eeee}
:root[data-theme="dark"] .how .bub.me{background:#005c4b}
:root[data-theme="dark"] .how .bub small{color:#cdbdbe}
body.plainhead .findbar,body.plainhead nav.tabs{display:none}

/* ---- Admin area ---- */
.menupop:not([data-admin="1"]) [data-needs="admin"]{display:none}
.admbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin:.6rem 0}
.admbar label{display:block;font-weight:650;font-size:.95rem}
.admbar .admfull{flex:1 1 100%}
.admbar .admfull input[type=search]{width:100%;box-sizing:border-box}
.admbar select,.admbar input[type=search]{min-height:3rem;padding:.4rem .6rem;border-radius:.6rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-size:1.05rem;max-width:100%}
.admwrap{overflow-x:auto;border:1px solid var(--muted);border-radius:.6rem}
.admtable{border-collapse:collapse;width:100%;min-width:640px;font-size:1.06rem}
.admtable th,.admtable td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--muted);vertical-align:top}
.admtable th{position:sticky;top:0;background:var(--card);font-weight:700}
.admtable td.num,.admtable th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.admtable .sub2{font-size:.9rem;color:var(--muted)}
.admtable code{font-size:.9rem;word-break:break-all}
.admtable select{min-height:3rem;font-size:1rem}
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin:.6rem 0}
.admgrid .stat{border:1px solid var(--muted);border-radius:.6rem;padding:.6rem .7rem;background:var(--card)}
.admgrid .stat b{display:block;font-size:1.6rem}
.admbtn{min-height:3rem;padding:.4rem .9rem;border-radius:.6rem;border:2px solid var(--brand);background:var(--card);color:var(--ink);font-size:1rem;font-weight:650}
.admbtn.go{background:var(--brand);color:var(--brand-ink)}
.printonly{display:none}
body.adm-wide .wrap{max-width:80rem}
body.adm-wide header .row{max-width:80rem}
body.adm-wide header .findbar{display:none}
body.adm-wide nav.tabs .in{max-width:80rem}
.admform{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.2rem .8rem}
.admform .field{margin:.35rem 0}
.admform .field.wide{grid-column:1/-1}
.field select,.field textarea{width:100%;min-height:3.2rem;padding:.5rem .8rem;border-radius:.6rem;border:2px solid var(--muted);background:var(--card);color:var(--ink);font-size:1.05rem}
.admtable .acts{white-space:nowrap}
.admtable .acts .admbtn{margin:.1rem .15rem .1rem 0}
.printtitle{margin:.4rem 0;font-size:1.15rem}
@media print{
  body.adm-print header,body.adm-print nav.tabs,body.adm-print .menupop,body.adm-print dialog,body.adm-print .skip,body.adm-print #status,body.adm-print .disclaimer{display:none!important}
  body.adm-print .wrap{max-width:none;margin:0}
  body.adm-print{background:#fff;color:#000}
  body.adm-print main{padding:0;margin:0}
  body.adm-print .noprint{display:none!important}
  body.adm-print .printonly{display:block}
  body.adm-print .admwrap{border:0;overflow:visible}
  body.adm-print .admtable{min-width:0;font-size:9.5pt;color:#000}
  body.adm-print .admtable th{position:static;background:#fff;border-bottom:2px solid #000}
  body.adm-print .admtable td{border-bottom:1px solid #999;padding:2pt 4pt}
  body.adm-print .admtable tr{break-inside:avoid}
  body.adm-print thead{display:table-header-group}
}

/* ---- Category circles (like the Sixty60 app) and the TrolleyUp pick ---- */
:root{--f-all:#4a4eb0;--f-groceries:#a85200;--f-fresh:#1a7236;--f-liquor:#85268a;--f-health:#bb2457}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--f-all:#b5b8ff;--f-groceries:#ffc27a;--f-fresh:#8be3a3;--f-liquor:#f0b0f4;--f-health:#ffaac8}}

/* ---------- Small helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(v){var p=Number(v).toFixed(2).split(".");return "R "+p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ")+"."+p[1]}
function say(msg){var el=document.getElementById("status");el.textContent="";setTimeout(function(){el.textContent=msg},50)}
function storeColor(s){
  if(STORES[s])return STORES[s];
  var c=["#7a4a00","#006b6b","#8a2b5a","#3d5a1a"],h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return c[Math.abs(h)%c.length];
}
function storeColorOn(s){return document.documentElement.dataset.dark==="1"?(STORES_DARK[s]||"#f7eeee"):storeColor(s)}
function badgeLink(s,r){
  var lab=r&&r.local?' <span class="tag localtag">Local store</span>':'';
  if(!r||!r.url)return badge(s)+lab;
  return '<a class="badge blink" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer" style="background:'+storeColor(s)+'" aria-label="Open this product on the '+esc(s)+' website (opens a new tab)">'+esc(s)+' \u2197</a>'+lab;
}
/* Store button for a row: opens that store's own product page in a new tab (48px tall); plain label when there is no link. */

  var inner='<span class="sn">'+esc(s)+(r&&r.url?' \u2197':'')+'</span><span class="cap">'+cap+'</span>';

function badge(s){return '<span class="badge" style="background:'+storeColor(s)+'">'+esc(s)+'</span>'}
function regionName(slug){var r=state.regions.find(function(x){return x.slug===slug});return r?r.name:slug}
function haversine(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function toDate(s){if(!s)return null;if(s instanceof Date)return s;var d=new Date(s);return isNaN(d)?null:d}
function fmtDate(d){d=toDate(d);if(!d)return "";
  return d.toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Africa/Johannesburg"}).replace(" at ",", ")}
function fmtDay(d){return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric",timeZone:"Africa/Johannesburg"})}
function hoursOld(d){d=toDate(d);return d?(Date.now()-d.getTime())/36e5:0}
function plural(n,w){return n+" "+w+(n===1?"":"s")}

/* ---------- Sign-in. Same accounts as TrolleyUp (Firebase). "dev" mode is for local testing only. ---------- */
var Auth=(function(){
  var mode=CFG.authMode||"firebase",fbP=null,devName=null,fbUser=null;
  function fb(){
    if(!fbP){
      var base="https://www.gstatic.com/firebasejs/10.14.1/";
      fbP=Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")]).then(function(m){
        var auth=m[1].getAuth(m[0].initializeApp(CFG.firebase));return {Au:m[1],auth:auth};
      });
      fbP.catch(function(){fbP=null});
    }
    return fbP;
  }
  function plain(e){
    var c=(e&&e.code)||"";
    if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return "That email or password is not right. Please check and try again.";
    if(/email-already-in-use/.test(c))return "That email already has an account. Tap “I already have an account” to sign in.";
    if(/weak-password/.test(c))return "Please choose a password of at least 6 characters.";
    if(/popup-closed|cancelled-popup/.test(c))return "The Google window was closed before sign-in finished. Please try again.";
    if(/popup-blocked/.test(c))return "Your browser blocked the Google window. Allow pop-ups for this site, or use email and password.";
    if(/network-request-failed/.test(c))return "No connection. Check your internet and try again.";
    if(/too-many-requests/.test(c))return "Too many tries. Please wait a few minutes and try again.";
    if(/unauthorized-domain/.test(c))return "Sign-in is not switched on for this web address yet. Please tell "+SUPPORT+".";
    return "Sign-in did not work. Please try again."+(c?" ("+c+")":"");
  }
  function wrap(p){return p.catch(function(e){throw new Error(plain(e))})}
  return {
    mode:mode,
    /* Calls back with true/false whenever sign-in changes. Rejects if sign-in could not load (offline). */
    start:function(cb){
      if(mode==="dev"){devName=load("pp_dev_user");cb(!!devName);return Promise.resolve()}
      return fb().then(function(f){f.Au.onAuthStateChanged(f.auth,function(u){fbUser=u&&!u.isAnonymous?u:null;cb(!!fbUser)})});
    },
    token:function(){
      if(mode==="dev")return Promise.resolve(devName?"dev:"+devName:null);
      return fbUser?fbUser.getIdToken():Promise.resolve(null);
    },
    email:function(){return mode==="dev"?(devName||""):(fbUser&&fbUser.email)||""},
    google:function(){return wrap(fb().then(function(f){return f.Au.signInWithPopup(f.auth,new f.Au.GoogleAuthProvider())}))},
    emailIn:function(e,p){return wrap(fb().then(function(f){return f.Au.signInWithEmailAndPassword(f.auth,e,p)}))},
    emailNew:function(e,p){return wrap(fb().then(function(f){return f.Au.createUserWithEmailAndPassword(f.auth,e,p)}))},
    reset:function(e){return wrap(fb().then(function(f){return f.Au.sendPasswordResetEmail(f.auth,e)}))},
    dev:function(name){devName=name;store("pp_dev_user",name);onAuth(true)},
    out:function(){
      if(mode==="dev"){devName=null;drop("pp_dev_user");onAuth(false);return Promise.resolve()}
      return fb().then(function(f){return f.Au.signOut(f.auth)});
    }
  };
})();

/* ---------- Talking to the price server ---------- */
function api(method,path,body,timeoutMs){
  return Auth.token().then(function(tok){
    var ctl=typeof AbortController!=="undefined"?new AbortController():null;
    var timer=setTimeout(function(){if(ctl)ctl.abort()},timeoutMs||15000);
    var opts={method:method,headers:{}};
    if(ctl)opts.signal=ctl.signal;
    if(tok)opts.headers.Authorization="Bearer "+tok;
    if(body!==undefined){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body)}
    return fetch(API+path,opts).then(function(r){
      clearTimeout(timer);
      var type=r.headers.get("content-type")||"";
      if(r.ok&&type.indexOf("json")<0)return r;
      return r.json().catch(function(){return {}}).then(function(b){
        if(r.ok)return b;
        var d=b.detail,e=new Error((d&&d.message)||(typeof d==="string"?d:"")||(Array.isArray(d)?"Please check what you typed and try again.":"The price server answered with error "+r.status+"."));
        e.status=r.status;e.code=(d&&d.code)||"";throw e;
      });
    },function(){clearTimeout(timer);var e=new Error(navigator.onLine===false?"You are offline.":"Could not reach the price server.");e.code="network";throw e});
  });
}
function qs(o){return Object.keys(o).filter(function(k){return o[k]!==""&&o[k]!=null}).map(function(k){return k+"="+encodeURIComponent(o[k])}).join("&")}

/* ---------- Data: product = {id,name,brand,size,cat,prices:{store:{price,promo,url,at,stale,unit}}} ---------- */
/* A product picture: only our own /api/v1/img/ files or https links; a broken picture removes itself. */
function pic(url,big){
  if(!url||!(url.indexOf("https://")===0||url.indexOf("/api/v1/img/")===0))return "";
  return '<img class="pic'+(big?' big':'')+'" src="'+esc(url)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">';
}
function eff(p){return p.promo!=null?p.promo:p.price}
function sortedStores(prod){return Object.keys(prod.prices).sort(function(a,b){return eff(prod.prices[a])-eff(prod.prices[b])||(a<b?-1:1)})}
function toProduct(it){
  var prices={};it.prices.forEach(function(p){prices[p.store]={price:p.price,promo:p.promo_price,url:p.url,at:p.scraped_at,stale:p.stale,local:!!p.local,unit:p.unit_price}});
  return {id:it.id,name:it.name,brand:it.brand,size:it.size,cat:it.category,image:it.image||"",prices:prices};
}
function applySession(s,fromCache){
  state.me=s.me;state.basket=s.basket;state.stamp=s.scraped_at;state.isSample=!!s.sample;
  state.items=s.items.map(function(i){return {q:i.quantity,on:i.on_list,p:toProduct(i.product)}});
  if(!fromCache){state.offline=false;state.error="";state.savedAt=new Date().toISOString();
    store("pp_session_"+state.region,{s:s,savedAt:state.savedAt})}
  state.towns=null;
  if(typeof pruneToList==="function")pruneToList();
}
function findItem(id){return state.items.find(function(i){return i.p.id===id})}
function onList(){return state.items.filter(function(i){return i.on})}
function loadSession(){
  return api("GET","/session?"+qs({region:state.region})).then(function(s){applySession(s);render()}).catch(function(e){
    if(handleAuthError(e))return;
    var c=load("pp_session_"+state.region);
    state.offline=true;state.error=e.message;
    if(c&&c.s){applySession(c.s,true);state.savedAt=c.savedAt}
    render();say(e.message+(c?" Showing saved prices.":""));
  });
}
function loadRegions(){
  return fetch(API+"/regions").then(function(r){return r.json()}).then(function(rs){
    if(Array.isArray(rs)&&rs.length){state.regions=rs;store("pp_regions",rs);fillRegions()}
  }).catch(function(){});
}
function handleAuthError(e){
  if(e.status===401){say("Please sign in again.");Auth.out();return true}
  return false;
}

/* ---------- Header lines shown on every screen ---------- */
function meterText(){
  var m=state.me;if(!m)return "";
  var s=m.session,items=s.active?s.items_used+" of "+s.items_max+" items looked up":"No session open";
  if(m.plan==="paid")return "Unlimited plan · "+items;
  var n=m.sessions_per_day;
  if(s.active)return "Session "+m.sessions_used_today+" of "+n+" today · "+items;
  var left=Math.max(0,n-m.sessions_used_today);
  return left?plural(left,"free session")+" left today":"No free sessions left today";
}
function newestPrice(){var n=null;state.items.forEach(function(i){for(var s in i.p.prices){var d=toDate(i.p.prices[s].at);if(d&&(!n||d>n))n=d}});return n}
function oldestPrice(){var o=null;state.items.forEach(function(i){for(var s in i.p.prices){var d=toDate(i.p.prices[s].at);if(d&&(!o||d<o))o=d}});return o}
function renderHead(){

/* ---------- Find: search products, then look up prices ---------- */
var findTimer=null;
function runFind(now){
  clearTimeout(findTimer);
  findTimer=setTimeout(function(){
    var key=state.region+"|"+state.cat+"|"+state.q;
    state.finding=true;state.findErr="";
    var browsing=!state.q.trim()&&state.cat==="All"&&!state.flt;
    if(browsing){state.finding=false;state.found=null;if(state.view==="find")renderMain();return}
    api("GET","/catalogue?"+qs({region:state.region,q:state.q.trim(),category:state.cat==="All"?"":state.cat,special:state.flt==="special"?"true":"",local:state.flt==="local"?"true":"",limit:50})).then(function(r){
      if(key!==state.region+"|"+state.cat+"|"+state.q)return;
      state.finding=false;state.found=r;
      if(state.view==="find")renderMain();
    }).catch(function(e){
      if(handleAuthError(e))return;
      state.finding=false;state.findErr=e.message;if(state.view==="find")renderMain();
    });
  },now?0:350);
}

/* Hand-drawn SVG line chart. Lines differ by dash pattern as well as colour; the legend states each latest price. */
function chart(history){
  var series=(history||[]).filter(function(s){return s.points.length});
  if(!series.length)return '<p class="sub">No history yet. It builds up as prices are checked each day.</p>';
  var dates={},vals=[];
  series.forEach(function(s){s.points.forEach(function(pt){dates[pt.date]=1;vals.push(pt.price)})});
  var ds=Object.keys(dates).sort();
  if(ds.length<2)return '<p class="sub">Only one day of prices so far. The chart appears after the next price check.</p>'+legend(series);
  var W=360,H=220,L=62,R=10,T=12,B=30,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max===min){max+=1;min=Math.max(0,min-1)}
  var t0=new Date(ds[0]).getTime(),t1=new Date(ds[ds.length-1]).getTime();
  function x(d){return L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R)}
  function y(v){return T+(max-v)/(max-min)*(H-T-B)}
  var g='';
  [min,(min+max)/2,max].forEach(function(v){g+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">R'+v.toFixed(2)+'</text>'});
  function day(d){return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short"})}
  g+='<text x="'+L+'" y="'+(H-8)+'">'+esc(day(ds[0]))+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(day(ds[ds.length-1]))+'</text>';
  series.forEach(function(s,i){
    var pts=s.points.map(function(pt){return x(pt.date).toFixed(1)+","+y(pt.price).toFixed(1)}).join(" ");
    g+='<polyline fill="none" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-linejoin="round" stroke-dasharray="'+DASHES[i%DASHES.length]+'" points="'+pts+'"/>';
    var last=s.points[s.points.length-1];g+='<circle cx="'+x(last.date)+'" cy="'+y(last.price)+'" r="4" fill="'+storeColorOn(s.store)+'"/>';
  });
  var summary=series.map(function(s){var a=s.points[0].price,z=s.points[s.points.length-1].price;
    return s.store+" went from R"+a.toFixed(2)+" to R"+z.toFixed(2)}).join("; ");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Price history: '+esc(summary)+'">'+g+'</svg>'+legend(series);
}
function legend(series){
  return '<ul class="legend">'+series.map(function(s,i){var last=s.points[s.points.length-1];
    return '<li><svg width="36" height="12" aria-hidden="true"><line x1="0" x2="36" y1="6" y2="6" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-dasharray="'+DASHES[i%DASHES.length]+'"/></svg>'+badge(s.store)+' <span>now '+money(last.price)+'</span></li>'}).join("")+'</ul>';
}

/* Asks the server for the newest version number straight from sw.js (never from a saved copy). */
function doUpdate(){
  var d=document.getElementById("dlg");
  return fetch("sw.js?check="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("server");return r.text()}).then(function(t){
    var m=/pp-shell-v(\d+)/.exec(t),n=m?+m[1]:0;
    if(!n)return ask("App update",'<p>Could not read the newest version. Please try again later.</p>',[["OK","","btn"]]);
    if(n===APP_VERSION)return ask("App update",'<p>You have the newest version (<b>'+n+'</b>).</p>',[["OK","","btn"]]);
    store("pp_updated",n);
    var jobs=[];
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(x){return x.unregister()}))}));
    if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("pp-shell")===0}).map(function(k){return caches.delete(k)}))}));
    return Promise.all(jobs).catch(function(){}).then(function(){location.replace(location.pathname+"?u="+Date.now()+location.hash)});
  }).catch(function(){
    ask("App update",'<p>Could not reach the server, so I cannot tell if there is a newer version. Check your connection and try again.</p>',[["OK","","btn"]]);
  });
}
/* After an update the page reloads on ?u=...: tidy the address and say what happened. */

  var n=load("pp_updated");

}

/* A small CSV reader: quotes, "" escapes, CRLF, BOM, and comma / semicolon / tab separators. */
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,"");
  var first=text.split(/\r?\n/,1)[0]||"",sep=",";
  [";","\t"].forEach(function(c){if(first.split(c).length>first.split(sep).length)sep=c});
  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(function(x){return x.trim()}))rows.push(row);row=[]}
    else cell+=c;
  }
  row.push(cell);if(row.some(function(x){return x.trim()}))rows.push(row);
  return rows;
}
function essentialRows(text){
  var rows=parseCsv(text);if(!rows.length)return [];
  var head=rows[0].map(function(x){return x.trim().toLowerCase()});
  var names=["item","item name","name","term","product","description"],cats=["category","type","department"];
  var ic=-1,cc=-1;
  head.forEach(function(h,i){if(ic<0&&names.indexOf(h)>=0)ic=i;if(cc<0&&cats.indexOf(h)>=0)cc=i});
  var hasHead=ic>=0;
  if(!hasHead){ic=0;cc=rows[0].length>1?1:-1}
  return rows.slice(hasHead?1:0).map(function(r){return {term:(r[ic]||"").trim(),category:cc>=0?(r[cc]||"").trim():""}}).filter(function(r){return r.term});
}

  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);

    ask("Checking the file",'<p>Checking <b>'+esc(file.name)+'</b>. A big file can take up to a minute. Nothing is saved yet.</p>',[]);
    return api("POST","/admin/localstores/"+id+"/import",{csv:text,filename:file.name,dry_run:true,replace:true},120000);
  }).then(function(r){
    var bad=r.invalid.slice(0,6).map(function(x){return '<li>Row '+x.row+': '+esc(x.name||"(empty)")+' \u2013 '+esc(x.why)+'</li>'}).join("");
    ask("Load this file for "+(st?st.name:"the store")+"?",'<p><b>'+r.rows+' rows</b> in <b>'+esc(file.name)+'</b>:</p><ul class="steps"><li><b>'+r.added+'</b> new items</li><li><b>'+r.updated+'</b> items already known (price refreshed)</li>'+
      '<li><b>'+r.matched_to_chains+'</b> items also sold by a big chain (one card, prices side by side)</li>'+(r.duplicates?'<li>'+r.duplicates+' repeated lines ignored</li>':'')+
      (r.out_of_stock?'<li><b>'+r.out_of_stock+'</b> items are marked out of stock and are left out</li>':'')+
      '<li>This store may list up to <b>'+r.max_items+'</b> items</li>'+
      (r.pictures||r.bad_pictures?'<li><b>'+r.pictures+'</b> picture links found'+(r.bad_pictures?', <b>'+r.bad_pictures+'</b> not usable (must start with https://; those items load without a picture)':'')+'</li>':'')+
      '<li id="lsremoved"><b>'+r.removed+'</b> of the store\u2019s current items are not in this file and will be hidden</li>'+(r.invalid_count?'<li><b>'+r.invalid_count+' rows skipped</b> because of problems:</li>':'')+'</ul>'+(bad?'<ul class="steps">'+bad+'</ul>':'')+
      (r.new_categories&&r.new_categories.length?'<p class="sub">Categories new to PricePulse (kept as the store wrote them): <b>'+r.new_categories.slice(0,6).map(esc).join(", ")+(r.new_categories.length>6?", \u2026":"")+'</b></p>':'')+
      '<label class="check"><input type="checkbox" id="lsreplace" checked><span>Replace the store\u2019s list (hide items missing from this file)</span></label>',
      [["Load the file","lsload","btn"],["Cancel","","btn alt"]]);
  }).catch(function(e){ask("Could not read that file",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]])});
}
function lsDoLoad(b,dlg){
  var p=ADM.lsPending;if(!p)return dlg.close();
  var replace=!!(document.getElementById("lsreplace")||{}).checked;b.disabled=true;
  return api("POST","/admin/localstores/"+p.id+"/import",{csv:p.csv,filename:p.filename,replace:replace,dry_run:false},120000).then(function(r){
    ADM.lsPending=null;ADM.loading=null;
    ask("File loaded",'<p><b>'+r.added+' added</b>, '+r.updated+' updated'+(replace?', '+r.removed+' hidden':'')+'.'+(r.invalid_count?' '+r.invalid_count+' rows were skipped.':'')+'</p><p class="sub">Shoppers in that region see the prices straight away.</p>',[["OK","","btn"]]);
    say("File loaded: "+r.added+" added.");admLoad();
  }).catch(function(e){dlg.close();ask("Could not load the file",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]])});
}
function lsHistory(id,name){
  api("GET","/admin/localstores/"+id+"/submissions").then(function(r){
    var rows=r.submissions.map(function(x){return '<tr><td>'+esc(fmtDate(x.received))+'</td><td>'+esc(x.filename||x.source)+'</td><td class="num">'+x.rows+'</td><td class="num">'+x.added+'</td><td class="num">'+x.updated+'</td><td class="num">'+x.removed+'</td><td class="num">'+x.invalid+'</td></tr>'}).join("");
    ask("Files from "+name,r.submissions.length?'<div class="admwrap"><table class="admtable" style="min-width:0"><thead><tr><th>Received</th><th>File</th><th class="num">Rows</th><th class="num">New</th><th class="num">Updated</th><th class="num">Hidden</th><th class="num">Skipped</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p>No files yet.</p>',[["Close","","btn"]]);
  }).catch(function(e){ask("Could not load the history",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]])});
}
function admClick(t){
  var d=t.dataset;
  if(d.adm==="lsnew")return lsForm(null);
  if(d.adm==="lsedit")return lsForm(lsStore(d.id));
  if(d.adm==="lstemplate")return admSaveFile("pricepulse-local-store-template.csv",LS_TEMPLATE);
  if(d.adm==="lshistory")return lsHistory(d.id,d.name);
  if(d.adm==="lsimport"){var f=document.getElementById("lsfile");if(f){f.value="";f.dataset.id=d.id;f.click()}return}
  if(d.adm==="espick"){var f=document.getElementById("esfile");if(f){f.value="";f.click()}return}
  if(d.adm==="esexample")return admSaveFile("pricepulse-essential-items-example.csv","item,category\r\nwhite mushrooms 250g,Fresh\r\nKoo baked beans 410g,Groceries\r\nPanado tablets 24s,Health & Beauty\r\n");
  if(d.adm==="esdownload"){var it=(ADM.data.essentials||{}).items||[];return admSaveFile("pricepulse-essential-items.csv","item,category\r\n"+it.map(function(r){return csvCell(r.term)+","+csvCell(r.category)}).join("\r\n")+"\r\n")}
  if(d.adm==="esremove"){ask("Remove this item?",'<p>Stop searching for <b>'+esc(d.term)+'</b> each night? Prices already collected stay.</p>',[["Remove it","esremove:"+d.id,"btn"],["Keep it","","btn alt"]]);return}
  if(d.adm==="tab"){ADM.preview=false;document.body.classList.remove("adm-print");ADM.tab=d.tab;ADM.err="";ADM.loading=null;renderMain();return admLoad()}
  if(d.adm==="vis"){
    t.disabled=true;
    return api("POST","/admin/products/"+encodeURIComponent(d.pid)+"/visibility",{state:d.state}).then(function(){
      say(d.state==="show"?"Shown to shoppers.":"Hidden from shoppers.");ADM.loading=null;admLoad();
    }).catch(function(e){t.disabled=false;ask("Could not save",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]])});
  }
  if(d.adm==="preview"){ADM.preview=true;renderMain();window.scrollTo(0,0);return}
  if(d.adm==="doprint")return void window.print();
  if(d.adm==="back"){ADM.preview=false;document.body.classList.remove("adm-print");renderMain();return}
  if(d.adm==="reqshow"){ADM.reqStatus=d.status;ADM.loading=null;delete ADM.data.requests;renderMain();return admLoad()}
  if(d.adm==="reqset"){
    t.disabled=true;
    return api("POST","/admin/requests/status",{term:d.term,status:d.status}).then(function(){
      say("Request "+d.status+".");ADM.loading=null;return admLoad();
    }).catch(function(e){t.disabled=false;ask("Could not save",'<p>'+esc(e.message)+'</p>',[["OK","","btn"]])});
  }
}
function admField(el){
  if(el.dataset.admf==="plan"){
    var plan=el.value,uid=el.dataset.uid;if(!plan)return;
    var words={free:"the normal Free plan",paid:"the Paid plan (unlimited sessions and items)",tester:"the Tester plan (unlimited sessions and items)"};
    ask("Change plan?",'<p>Put account <b>'+esc(uid)+'</b> on '+words[plan]+'?</p>',[["Yes, change it","admplan:"+uid+":"+plan,"btn"],["Cancel","","btn alt"]]);
    el.value="";return;
  }
  ADM.f[el.dataset.admf]=el.value;
  clearTimeout(ADM.timer);
  ADM.timer=setTimeout(function(){ADM.loading=null;admLoad()},el.dataset.admf==="q"?350:0);
}
document.getElementById("main").addEventListener("change",function(e){
  if(e.target.id==="esfile")return esFileChosen(e.target.files&&e.target.files[0]);
  if(e.target.id==="lsfile")return lsFileChosen(e.target);
  if(e.target.dataset&&e.target.dataset.admf)admField(e.target)});
document.getElementById("main").addEventListener("input",function(e){if(e.target.dataset&&e.target.dataset.admf==="q")admField(e.target)});

/* ---------- Rendering and navigation ---------- */
var ICONS={
  find:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  towns:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  account:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>'
};
var LABELS={find:"Find",list:"List",towns:"Towns",account:"Account"};
function renderNav(){
  var cur=state.view==="product"?"find":state.view;
  document.getElementById("nav").innerHTML=Object.keys(LABELS).map(function(k){
    var n=k==="list"?listCount():0;
    return '<button type="button" data-view="'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+ICONS[k]+'<span>'+LABELS[k]+(n?'<span class="cnt" aria-label=", '+n+' items">'+n+'</span>':'')+'</span></button>'}).join("");
}
function renderMain(){
  var m=document.getElementById("main"),h;
  document.body.classList.toggle("adm-wide",state.view==="admin"&&state.phase==="app");
  if(state.phase==="boot")h='<p class="empty">Opening PricePulse…</p>';
  else if(state.phase==="signin")h=viewSignin();
  else if(state.phase==="idcheck")h=viewIdCheck();
  else h=state.view==="find"?viewFind():state.view==="towns"?viewTowns():state.view==="list"?viewList():state.view==="product"?viewProduct():state.view==="admin"?viewAdmin():viewAccount();
  m.innerHTML=h;
  document.body.classList.toggle("front",state.phase==="app"&&state.view==="find"&&!(state.q.trim()||state.cat!=="All"||state.flt));
}
/* The front screen fills the space between the header and the footer; the photo panel sits at the bottom, touching the footer.
   The header and footer heights are measured and kept in CSS variables. */
function fitFront(){
  var h=document.querySelector("header"),n=document.querySelector("nav.tabs"),r=document.documentElement.style;
  if(h)r.setProperty("--hdr-h",Math.round(h.getBoundingClientRect().height)+"px");
  if(n&&getComputedStyle(n).display!=="none")r.setProperty("--nav-h",Math.round(n.getBoundingClientRect().height)+"px");
}
function render(){
  applyTheme();renderMain();renderHead();fitFront();
  if(state.phase!=="app")return;
  renderNav();
  if(state.view==="towns")loadTowns();
  if(state.view==="product")loadDetail();
  if(state.view==="admin")admLoad();
  if(state.view==="find"&&!state.found&&!state.finding&&!state.findErr)runFind(true);
}
/* The Find tab and the PricePulse title go to the clean front screen: typed text, category and the
   Specials / Local Stores / All Stores list are cleared. (Other links to #find, such as "Back to products", keep the results.) */
function goHome(){
  clearTimeout(findTimer);
  state.q="";state.cat="All";state.flt="";state.found=null;state.findErr="";
  var q=document.getElementById("q");if(q)q.value="";
  go("find");
}
function go(v,focus){
  if(state.phase!=="app")return;
  if(typeof ADM!=="undefined"&&ADM.preview){ADM.preview=false}
  document.body.classList.remove("adm-print");
  if(v.indexOf("product/")===0){state.view="product";state.productId=+v.slice(8)}
  else if(v.indexOf("account")===0){state.view="account";if(v==="account/paid")afterPayment();if(v==="account/cancelled")say("Payment was cancelled. Nothing was charged.");v="account"}
  else if(v==="admin"&&state.me&&state.me.is_admin)state.view="admin";
  else state.view=LABELS[v]?v:"find";
  render();window.scrollTo(0,0);
  var target="#"+(state.view==="product"?"product/"+state.productId:state.view);
  if(location.hash!==target){try{history.pushState(null,"",target)}catch(e){location.hash=target}}
  if(focus!==false)document.getElementById("main").focus({preventScroll:true});
}
function savePrefs(){store("pp_region",state.region);store("pp_unit",state.unitMode);store("pp_theme",state.theme)}
function applyTheme(){
  var root=document.documentElement;
  if(state.theme==="system")root.removeAttribute("data-theme");else root.setAttribute("data-theme",state.theme);
  var dark=state.theme==="dark"||(state.theme==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.dark=dark?"1":"0";
}
function fillRegions(){
  var sel=document.getElementById("base");
  sel.innerHTML=state.regions.map(function(r){return '<option value="'+esc(r.slug)+'">'+esc(r.name)+'</option>'}).join("");
  if(!state.regions.some(function(r){return r.slug===state.region}))state.region=state.regions[0].slug;
  sel.value=state.region;
}
function setRegion(slug){
  if(slug===state.region)return;
  state.region=slug;state.detail=null;state.towns=null;state.found=null;savePrefs();
  document.getElementById("base").value=slug;
  render();loadSession();
}
function locate(){
  if(!navigator.geolocation){say("This phone cannot share its location. Choose your town from the list.");return}
  say("Finding the nearest town…");
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude,best=null;
    state.regions.forEach(function(r){var d=haversine(lat,lon,r.lat,r.lon);if(!best||d<best.d)best={r:r,d:d}});
    if(!best)return;
    setRegion(best.r.slug);
    say("Nearest town: "+best.r.name+", about "+Math.round(best.d)+" km away."+(best.d>80?" That is far; you can choose another town from the list.":""));
  },function(err){
    say(err.code===1?"Location is blocked for this app. Choose your town from the list instead.":"Could not find your location. Choose your town from the list instead.");
  },{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}

/* Sign-in changed: work out which screen to show. */
function onAuth(signedIn){
  state.authErr="";state.busy=false;
  if(!signedIn){state.phase="signin";state.me=null;state.items=[];state.basket=null;state.found=null;return render()}
  api("GET","/me").then(function(m){
    state.me=m;
    if(!m.id_checked){state.phase="idcheck";return render()}
    enterApp();
  }).catch(function(e){
    if(e.status===401){state.phase="signin";state.authErr=e.message;return render()}
    /* Server unreachable: show the saved list if there is one. */
    var c=load("pp_session_"+state.region);
    if(c&&c.s){state.phase="app";state.offline=true;state.error=e.message;applySession(c.s,true);state.savedAt=c.savedAt;state.view="list";return render()}
    state.phase="signin";state.authErr=e.message+" Please try again when you have a connection.";render();
  });
}
function enterApp(){
  state.phase="app";
  var h=(location.hash||"").slice(1);
  render();
  loadSession().then(function(){if(h)go(h,false)});
}

document.addEventListener("click",function(e){
  if(e.target.closest("dialog"))return;
  var a=e.target.closest("a[href^='#']");
  if(a){e.preventDefault();if(a.classList.contains("homelink"))return goHome();go(a.getAttribute("href").slice(1));return}
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.view)return d.view==="find"?goHome():go(d.view);
  if(d.cat){state.cat=d.cat;state.flt="";state.found=null;renderMain();return runFind(true)}
  if(d.unit){state.unitMode=d.unit==="1";savePrefs();return renderMain()}
  if(d.radius){state.radius=+d.radius;return render()}
  if(d.theme){state.theme=d.theme;savePrefs();return render()}
  if(d.look){if(state.offline)return say("Looking up prices needs a connection.");t.disabled=true;t.textContent="Looking up…";return lookUp(+d.look)}
  if(d.toggle){var it=findItem(+d.toggle);if(it)setItem(it.p.id,{on_list:!it.on}).then(function(){say(it.p.name+(it.on?" taken off your list.":" put on your list."))});return}
  if(d.inc||d.dec){
    var i2=findItem(+(d.inc||d.dec));if(!i2)return;
    if(d.dec&&i2.q<=1)return void setItem(i2.p.id,{on_list:false}).then(function(){say(i2.p.name+" taken off your list.")});
    var nq=Math.min(99,i2.q+(d.inc?1:-1));
    return void setItem(i2.p.id,{quantity:nq}).then(function(){var b=document.querySelector('[data-'+(d.inc?'inc':'dec')+'="'+i2.p.id+'"]');if(b)b.focus();say(i2.p.name+": "+nq)});
  }
  if(d.adm)return admClick(t);
  if(d.pick){return togglePick(+d.pick)}
  switch(d.act){
    case "google":return void Auth.google().catch(function(er){formState(document.getElementById("emailform"),false,er.message)});
    case "mode-in":state.signMode="in";state.authErr="";return renderMain();
    case "mode-new":state.signMode="new";state.authErr="";return renderMain();
    case "forgot":{
      var em=(document.querySelector('#emailform [name=email]')||{}).value||"";
      var ef=document.getElementById("emailform");
      if(!em)return formState(ef,false,"Type your email address above first, then tap Forgot password.");
      return void Auth.reset(em).then(function(){formState(ef,false,"We sent a password reset email to "+em+". Open it, choose a new password, then sign in here.")},function(er){formState(ef,false,er.message)});
    }
    case "signout":return void Auth.out();
    case "refind":state.findErr="";return runFind(true);
    case "catsmore":state.catsMore=!state.catsMore;return renderMain();
    case "viewall":state.flt=t.dataset.kind;state.cat="All";state.found=null;renderMain();window.scrollTo(0,0);return runFind(true);
    case "clearflt":state.flt="";state.found=null;renderMain();return runFind(true);
    case "request":return requestDialog(t.dataset.term||"");
    case "share":return shareList();
    case "export":return exportDialog();
    case "clear":return clearSession();
    case "upgrade":return upgrade();
    case "refresh":return void refreshMe().then(function(m){say(m.plan==="paid"?"Your Unlimited plan is active.":"Not paid yet.")});
    case "cancelplan":return ask("Cancel your plan?",'<p>No more payments will be taken. You keep unlimited sessions until the end of the month you have paid for, then go back to the free plan.</p>',[["Cancel my plan","docancel","btn"],["Keep my plan","","btn alt"]]);
    case "delete":return ask("Delete your PricePulse data?",'<p>This removes your age check, your sessions and your list from PricePulse. It does not delete your sign-in, which you also use for TrolleyUp.</p>',[["Delete my data","dodelete","btn"],["Keep it","","btn alt"]]);
  }
});
/* Forms keep what was typed when something goes wrong: only the message and button change. */
function formState(f,busy,msg){
  var b=f.querySelector("button.btn"),er=f.querySelector(".err");
  if(b)b.disabled=!!busy;
  if(er&&msg!==undefined)er.textContent=msg;
  if(msg)say(msg);
}
document.addEventListener("submit",function(e){
  var f=e.target;e.preventDefault();
  if(f.id==="devform")return Auth.dev(f.querySelector("[name=name]").value.trim());
  if(f.id==="emailform"){
    formState(f,true,"");
    var em=f.email.value.trim(),pw=f.password.value;
    (state.signMode==="new"?Auth.emailNew(em,pw):Auth.emailIn(em,pw)).catch(function(er){formState(f,false,er.message)});
    return;
  }
  if(f.id==="idform"){
    formState(f,true,"");
    api("POST","/me/verify-id",{id_number:f.idnum.value,accept_terms:f.terms.checked}).then(function(m){
      state.me=m;say(m.adult?"Thank you. Your age is confirmed.":"Thank you. Liquor is hidden because you are under 18.");enterApp();
    }).catch(function(er){if(handleAuthError(er))return;formState(f,false,er.message);f.idnum.focus()});
  }
});
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value;
  if(state.view!=="find"){state.view="find";try{history.replaceState(null,"","#find")}catch(x){}renderNav()}
  runFind();
});
document.getElementById("base").addEventListener("change",function(e){setRegion(e.target.value)});
document.getElementById("locate").addEventListener("click",locate);
window.addEventListener("popstate",function(){go((location.hash||"#find").slice(1),false)});
window.addEventListener("online",function(){if(state.phase==="app"&&state.offline)loadSession()});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(state.theme==="system")render()});

/* ---------- Start ---------- */
(function init(){
  state.region=load("pp_region")||"paarl";state.unitMode=!!load("pp_unit");state.theme=load("pp_theme")||"system";
  var rs=load("pp_regions");if(Array.isArray(rs)&&rs.length)state.regions=rs;
  setupMenu();afterUpdateNote();
  fillRegions();render();loadRegions();
  Auth.start(onAuth).catch(function(){
    /* Sign-in could not load (no connection). Show the saved list if there is one. */
    var c=load("pp_session_"+state.region);
    if(c&&c.s){state.phase="app";state.offline=true;state.error="You are offline.";applySession(c.s,true);state.savedAt=c.savedAt;state.view="list";return render()}
    state.phase="signin";state.authErr="No connection. PricePulse needs the internet to sign you in.";render();
  });
  var secure=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if("serviceWorker" in navigator&&secure)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
