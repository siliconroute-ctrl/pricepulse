<style>
/* Layout: phone-first app shell. Sticky red header, scrolling content, fixed bottom nav.
   Sizes are in rem so the app follows the phone's text-size setting (1rem = 17px by default). */
:root{
  --bg:#f6f2f1; --card:#ffffff; --ink:#1d1415; --muted:#5a4d4e; --line:#d9cecd;
  --brand:#b00d27; --brand-ink:#ffffff; --brand-text:#b00d27; --best:#08532a; --best-bg:#e1f2e6; --warn:#7a4f00; --warn-bg:#fff3d6;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f10; --card:#221819; --ink:#f7eeee; --muted:#cdbdbe; --line:#46383a;
  --brand:#a3142a; --brand-ink:#ffffff; --brand-text:#ff8595; --best:#7fe7a6; --best-bg:#12301e; --warn:#ffd27a; --warn-bg:#3a2a08;
  --chip:#2f2324; --chip-on:#f7eeee; --chip-on-ink:#150f10; --focus:#ffffff; color-scheme:dark}
*{box-sizing:border-box}

.locbtn{min-height:3rem;min-width:3rem;border-radius:.5rem;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;padding:0 .6rem;display:inline-flex;align-items:center;gap:.3rem}

.tag::before{content:"\2713\00a0"}

.others .p{font-weight:700;font-size:1.06rem}

.li{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}

.tot-row:first-child{border-top:0}
.tot-row.win{background:var(--best-bg);border-radius:.6rem;padding:.6rem .7rem;border:0;margin-top:.25rem}
.amt{font-family:var(--font-display);font-size:1.75rem;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem}
.btn{min-height:3rem;padding:0 1.05rem;border-radius:.7rem;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:.4rem}
.btn.alt{background:transparent;color:var(--brand-text);border-color:var(--brand-text)}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
pre{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.7rem;overflow-x:auto;font-size:.8rem;margin:.5rem 0}
.disclaimer{margin:1.4rem 0 0;padding:.7rem .8rem;border-left:4px solid var(--brand);background:var(--card);border-radius:.4rem;font-size:.94rem}
.chart{width:100%;height:auto;display:block;margin-top:.4rem}
.chart text{fill:var(--muted);font-size:14px;font-family:var(--font-body)}
.chart .grid-line{stroke:var(--line);stroke-width:1}
.legend{list-style:none;margin:.4rem 0 0;padding:0}
.legend li{display:flex;align-items:center;gap:.5rem;padding:.25rem 0}
.legend svg{flex:none}
.back{margin-top:.8rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:2px solid var(--line);
  padding:.35rem max(8px,env(safe-area-inset-right,0px)) calc(.35rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:40rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem}
nav.tabs button{min-height:3.4rem;border:0;background:transparent;border-radius:.6rem;font-weight:650;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
nav.tabs button svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--chip);box-shadow:inset 0 -3px 0 var(--brand)}
.cnt{font-size:.76rem;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 .45rem;margin-left:.25rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

<div class="wrap">
<header>

<script>
"use strict";
/* ---------- Settings and constants ---------- */

var CATS = ["All","Groceries","Fresh","Liquor","Health & Beauty"];
/* Used until the server's list arrives, and when offline. Location never leaves the phone. */
var FALLBACK_REGIONS = [
  {slug:"paarl",name:"Paarl",lat:-33.7342,lon:18.9621},{slug:"wellington",name:"Wellington",lat:-33.6393,lon:19.0112},

  {slug:"hermanus",name:"Hermanus",lat:-34.4187,lon:19.2345}];
/* Example figures for trying the app without a server. Clearly labelled in the app. */
var SAMPLE = [
 ["Albany Superior White Bread","700g","Groceries",{"Checkers":19.99,"Pick n Pay":20.99,"Woolworths":24.99}],
 ["White Star Super Maize Meal","5kg","Groceries",{"Checkers":64.99,"Pick n Pay":66.99,"Woolworths":72.99}],

 ["Coca-Cola Original","2L","Groceries",{"Checkers":25.99,"Pick n Pay":26.99}],
 ["Clover Full Cream Milk","2L","Fresh",{"Checkers":36.99,"Pick n Pay":38.49,"Woolworths":41.99}],
 ["Clover Low Fat Milk","2L","Fresh",{"Checkers":35.99,"Pick n Pay":37.49,"Woolworths":40.99}],
 ["Large Eggs","18 pack","Fresh",{"Checkers":69.99,"Pick n Pay":72.99,"Woolworths":79.99}],
 ["Chicken Portions","2kg","Fresh",{"Checkers":109.99,"Pick n Pay":114.99,"Woolworths":134.99}],
 ["Bananas","per kg","Fresh",{"Checkers":24.99,"Pick n Pay":26.99,"Woolworths":29.99}],
 ["Clover Butter","500g","Fresh",{"Checkers":84.99,"Pick n Pay":89.99,"Woolworths":99.99}],
 ["Castle Lite","24 x 340ml","Liquor",{"Ultra Liquors":329.99,"Liquorland":339.99,"Checkers":344.99,"Pick n Pay":349.99}],
 ["Klipdrift Premium Brandy","750ml","Liquor",{"Ultra Liquors":189.99,"Liquorland":194.99,"Pick n Pay":199.99}],
 ["Savanna Dry Cider","6 x 330ml","Liquor",{"Ultra Liquors":98.99,"Liquorland":102.99,"Checkers":104.99}],
 ["Fat Bastard Chardonnay","750ml","Liquor",{"Ultra Liquors":79.99,"Liquorland":84.99,"Checkers":89.99}],

];

var state = {
  view:"compare", productId:null, cat:"All", q:"", region:"paarl", regions:FALLBACK_REGIONS.slice(),
  products:[], source:"sample", stamp:null, isSample:true, savedAt:null, error:"", loading:false,
  list:{}, unitMode:false, radius:50, townScope:"list", towns:null, townsKey:"", detail:null, theme:"system"

/* ---------- Small helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(v){var p=v.toFixed(2).split(".");return "R "+p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ")+"."+p[1]}
function key(n,s){return (n+"|"+s).toLowerCase().replace(/\s+/g," ").trim()}
function say(msg){var el=document.getElementById("status");el.textContent="";setTimeout(function(){el.textContent=msg},50)}
function storeColor(s){
  if(STORES[s])return STORES[s];
  var c=["#7a4a00","#006b6b","#8a2b5a","#3d5a1a"],h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return c[Math.abs(h)%c.length];
}
function badge(s){return '<span class="badge" style="background:'+storeColor(s)+'">'+esc(s)+'</span>'}
function regionName(slug){var r=state.regions.find(function(x){return x.slug===slug});return r?r.name:slug}
function haversine(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
/* Dates: API gives UTC ("...Z"); scraper files give South African time ("2026-10-27 07:30"). */
function toDate(s){
  if(!s)return null;if(s instanceof Date)return s;
  var t=String(s);if(/^\d{4}-\d\d-\d\d[ T]\d\d:\d\d(:\d\d)?$/.test(t))t=t.replace(" ","T")+(t.length===16?":00":"")+"+02:00";
  var d=new Date(t);return isNaN(d)?null:d;
}
function fmtDate(d){d=toDate(d);if(!d)return "";
  return d.toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Africa/Johannesburg"}).replace(" at ",", ")}
function hoursOld(d){d=toDate(d);return d?(Date.now()-d.getTime())/36e5:0}

/* Size parsing for unit prices when data comes from a file (the server does this itself). */
var UNITS={kg:["g",1000],g:["g",1],gr:["g",1],l:["ml",1000],lt:["ml",1000],ltr:["ml",1000],litre:["ml",1000],ml:["ml",1],cl:["ml",10]};
function parseSize(t){
  if(!t)return null;var s=String(t).toLowerCase().replace(",",".");
  if(/per\s*kg|\/\s*kg|loose/.test(s))return {qty:1000,unit:"g",pack:1,byWeight:true};
  var m=s.match(/(\d+)\s*[x\u00d7*]\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|ltr|lt|litre|l|ml|cl)\b/)||null;
  if(m)return {qty:+m[2]*UNITS[m[3]][1],unit:UNITS[m[3]][0],pack:+m[1]};
  m=s.match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|ltr|lt|litre|l|ml|cl)\b/);
  if(m)return {qty:+m[1]*UNITS[m[2]][1],unit:UNITS[m[2]][0],pack:1};
  m=s.match(/(\d+)\s*(pack|pk|tablets?|tabs?|capsules?|s\b|'s|rolls?|bags?|each|ea\b)/);
  if(m)return {qty:+m[1],unit:"each",pack:1};
  return null;
}
function unitPrice(size,price){
  var s=parseSize(size);if(!s||!price)return null;
  if(s.byWeight)return {value:price/10,unit:"per 100g"};
  var total=s.qty*s.pack;if(!total)return null;
  if(s.unit==="each")return {value:price/total,unit:"per item"};
  return {value:price/total*100,unit:s.unit==="g"?"per 100g":"per 100ml"};
}

/* ---------- Data model: product = {id,name,brand,size,cat,prices:{store:{price,promo,url,at,unit}}} ---------- */
function eff(p){return p.promo!=null?p.promo:p.price}
function bestStore(prod){var b=null;for(var s in prod.prices){if(b===null||eff(prod.prices[s])<eff(prod.prices[b])||(eff(prod.prices[s])===eff(prod.prices[b])&&s<b))b=s}return b}
function sortedStores(prod){return Object.keys(prod.prices).sort(function(a,b){return eff(prod.prices[a])-eff(prod.prices[b])||(a<b?-1:1)})}
function fromApi(items){
  return items.map(function(it){
    var prices={};it.prices.forEach(function(p){prices[p.store]={price:p.price,promo:p.promo_price,url:p.url,at:p.scraped_at,stale:p.stale,unit:p.unit_price}});
    return {id:String(it.id),apiId:it.id,name:it.name,brand:it.brand,size:it.size,cat:it.category,prices:prices};
  });
}
function fromRows(json){
  var items=Array.isArray(json)?json:(json.items||json.products||[]);
  var stamp=Array.isArray(json)?null:(json.scraped_at||null);
  var map={},order=[];
  items.forEach(function(it){
    var price=parseFloat(String(it.price).replace(/[^0-9.]/g,""));
    if(!it.name||!it.store||!isFinite(price)||price<=0)return;
    var promo=it.promo_price!=null?parseFloat(String(it.promo_price).replace(/[^0-9.]/g,"")):null;
    if(!(promo>0&&promo<price))promo=null;
    var k=key(it.name,it.size||"");
    if(!map[k]){map[k]={id:k,name:it.name,size:it.size||"",cat:it.category||"Groceries",prices:{}};order.push(k)}
    var cur=map[k].prices[it.store],row={price:price,promo:promo,url:it.url||"",at:it.scraped_at||stamp};
    if(!cur||eff(row)<eff(cur))map[k].prices[it.store]=row;
  });
  var arr=order.map(function(k){return map[k]});
  if(!arr.length)throw new Error("No usable rows. Each row needs store, name and price.");
  return {products:arr,region:Array.isArray(json)?"":(json.region||""),stamp:stamp,sample:!!json.sample};
}
function loadSample(){
  state.products=fromRows(SAMPLE.map(function(r){return Object.keys(r[3]).map(function(s){return {store:s,name:r[0],size:r[1],category:r[2],price:r[3][s]}})}).reduce(function(a,b){return a.concat(b)},[])).products;
  state.source="sample";state.isSample=true;state.stamp=null;state.savedAt=null;
}

/* ---------- Network ---------- */
function getJSON(url,opts){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort()},10000);
  opts=opts||{};if(ctl)opts.signal=ctl.signal;
  return fetch(url,opts).then(function(r){
    clearTimeout(timer);
    return r.json().catch(function(){return {}}).then(function(body){
      if(!r.ok){var e=new Error(body.detail||("The price server answered with error "+r.status+"."));e.status=r.status;throw e}
      return body;
    });
  },function(err){clearTimeout(timer);throw new Error(navigator.onLine===false?"You are offline.":"Could not reach the price server.")});
}
function loadRegions(){
  return getJSON(API+"/regions").then(function(rs){
    if(Array.isArray(rs)&&rs.length){state.regions=rs;store("pp_regions",rs);fillRegions()}
  }).catch(function(){});
}
function loadLive(){
  var region=state.region;state.loading=true;renderFresh();
  var all=[],first=null;
  function page(offset){
    return getJSON(API+"/products?region="+encodeURIComponent(region)+"&limit=100&offset="+offset).then(function(b){
      if(!first)first=b;all=all.concat(b.items);
      if(all.length<b.total&&offset<1900)return page(offset+100);
    });
  }
  return page(0).then(function(){
    if(region!==state.region)return;
    state.loading=false;state.error="";
    state.products=fromApi(all);state.source="api";state.isSample=!!first.sample;state.stamp=first.scraped_at;
    state.savedAt=new Date().toISOString();state.note=first.note||"";
    store("pp_cache_"+region,{items:all,stamp:first.scraped_at,sample:!!first.sample,savedAt:state.savedAt,note:state.note});
    state.towns=null;render();
  }).catch(function(err){
    if(region!==state.region)return;
    state.loading=false;state.error=err.message;
    if(!useCache(region)&&state.source!=="file")loadSample();
    render();say(state.error+" "+(state.source==="cache"?"Showing saved prices.":"Showing example prices."));
  });
}
function useCache(region){
  var c=load("pp_cache_"+region);
  if(!c||!c.items)return false;
  state.products=fromApi(c.items);state.source="cache";state.isSample=!!c.sample;state.stamp=c.stamp;state.savedAt=c.savedAt;state.note=c.note||"";
  return true;
}

function oldestPrice(){var o=null;state.products.forEach(function(p){for(var s in p.prices){var d=toDate(p.prices[s].at);if(d&&(!o||d<o))o=d}});return o}

function card(p){
  var b=bestStore(p),bp=p.prices[b],others=sortedStores(p).filter(function(s){return s!==b});

  return '<article class="card"><div class="top"><div style="min-width:0"><h3><a href="#product/'+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a></h3><div class="size">'+esc(p.size)+'</div></div>'+
    '<button class="add" type="button" data-add="'+esc(p.id)+'" aria-pressed="'+on+'" aria-label="'+(on?'Remove '+esc(p.name)+' from list':'Add '+esc(p.name)+' to list')+'">'+(on?'On list':'+ List')+'</button></div>'+
    '<div class="best"><div><div class="tag">Best price</div><div class="price">'+main+(state.unitMode&&u?' <span class="unit">'+esc(u.unit)+'</span>':'')+'</div>'+
    (second?'<div class="unit">'+second+'</div>':'')+(bp.promo!=null?'<div class="was">Usually '+money(bp.price)+'</div>':'')+oldTag(bp)+'</div>'+badge(b)+'</div>'+
    (others.length?'<ul class="others">'+others.map(function(s){
      var r=p.prices[s],uu=priceUnit(p,r);
      var shown=state.unitMode&&uu?money(uu.value)+' '+esc(uu.unit):money(eff(r));
      var diff=state.unitMode&&uu&&u?'':' <span class="diff">'+money(eff(r)-eff(bp))+' more</span>';
      return '<li><span>'+badge(s)+'</span><span><span class="p">'+shown+'</span>'+diff+oldTag(r)+'</span></li>'}).join("")+'</ul>':

}

/* Hand-drawn SVG line chart. Lines differ by dash pattern as well as colour; the legend states each latest price. */
function chart(history){
  var series=(history||[]).filter(function(s){return s.points.length});
  if(!series.length)return '<p class="sub">No history yet. It builds up as prices are checked each day.</p>';
  var dates={},vals=[];
  series.forEach(function(s){s.points.forEach(function(pt){dates[pt.date]=1;vals.push(pt.price)})});
  var ds=Object.keys(dates).sort();
  if(ds.length<2)return '<p class="sub">Only one day of prices so far. The chart appears after the next price check.</p>'+legend(series);
  var W=360,H=220,L=62,R=10,T=12,B=30,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max===min){max+=1;min=Math.max(0,min-1)}
  var t0=new Date(ds[0]).getTime(),t1=new Date(ds[ds.length-1]).getTime();
  function x(d){return L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R)}
  function y(v){return T+(max-v)/(max-min)*(H-T-B)}
  var g='';
  [min,(min+max)/2,max].forEach(function(v){g+='<line class="grid-line" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">R'+v.toFixed(2)+'</text>'});
  g+='<text x="'+L+'" y="'+(H-8)+'">'+esc(fmtDay(ds[0]))+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(fmtDay(ds[ds.length-1]))+'</text>';
  series.forEach(function(s,i){
    var pts=s.points.map(function(pt){return x(pt.date).toFixed(1)+","+y(pt.price).toFixed(1)}).join(" ");
    g+='<polyline fill="none" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-linejoin="round" stroke-dasharray="'+DASHES[i%DASHES.length]+'" points="'+pts+'"/>';
    var last=s.points[s.points.length-1];g+='<circle cx="'+x(last.date)+'" cy="'+y(last.price)+'" r="4" fill="'+storeColorOn(s.store)+'"/>';
  });
  var summary=series.map(function(s){var a=s.points[0].price,z=s.points[s.points.length-1].price;
    return s.store+" went from R"+a.toFixed(2)+" to R"+z.toFixed(2)}).join("; ");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Price history: '+esc(summary)+'">'+g+'</svg>'+legend(series);
}
/* Lighter line colours for dark mode, so every line stays visible. */
var STORES_DARK={"Checkers":"#6fd0f0","Pick n Pay":"#9dbbff","Woolworths":"#e8e8e8","Ultra Liquors":"#d4a8ff","Liquorland":"#ffc56b","Dis-Chem":"#86e8a8"};
function storeColorOn(s){return document.documentElement.dataset.dark==="1"?(STORES_DARK[s]||"#f7eeee"):storeColor(s)}
function legend(series){
  return '<ul class="legend">'+series.map(function(s,i){var last=s.points[s.points.length-1];
    return '<li><svg width="36" height="12" aria-hidden="true"><line x1="0" x2="36" y1="6" y2="6" stroke="'+storeColorOn(s.store)+'" stroke-width="3" stroke-dasharray="'+DASHES[i%DASHES.length]+'"/></svg>'+badge(s.store)+' <span>now '+money(last.price)+'</span></li>'}).join("")+'</ul>';
}
function fmtDay(d){return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short"})}

/* ---------- Towns (real per-town data from the server; no made-up multipliers) ---------- */

function listIds(){return Object.keys(state.list).map(function(id){var p=findProduct(id);return p&&p.apiId}).filter(Boolean)}
function townsKey(){return [state.region,state.radius,state.townScope,state.townScope==="list"?listIds().join(","):""].join("|")}
function loadTowns(){
  if(state.source!=="api")return;

/* ---------- List ---------- */
function listCount(){var n=0;for(var k in state.list)n+=state.list[k].q;return n}
function basket(){
  var items=[],missing=[];
  Object.keys(state.list).forEach(function(id){var p=findProduct(id);if(p)items.push(p);else missing.push(id)});
  var stores={};items.forEach(function(p){for(var s in p.prices)stores[s]=1});
  var totals=Object.keys(stores).map(function(s){
    var tot=0,have=0;items.forEach(function(p){if(p.prices[s]){tot+=eff(p.prices[s])*state.list[p.id].q;have++}});
    return {s:s,tot:tot,have:have,full:have===items.length};
  });
  var full=totals.filter(function(r){return r.full}).sort(function(a,b){return a.tot-b.tot||(a.s<b.s?-1:1)});
  var split={},splitTot=0;
  items.forEach(function(p){var b=bestStore(p),line=eff(p.prices[b])*state.list[p.id].q;splitTot+=line;(split[b]=split[b]||[]).push({p:p,line:line})});
  return {items:items,missing:missing,full:full,partial:totals.filter(function(r){return !r.full}),split:split,splitTot:splitTot};
}

    h+='<div class="tot-row"><div>'+badge(s)+'<div class="size">'+lines.map(function(l){return esc(l.p.name)+(state.list[l.p.id].q>1?' \u00d7'+state.list[l.p.id].q:'')}).join(", ")+'</div></div><span class="p" style="font-weight:700">'+money(sub)+'</span></div>';
  });

function listButtons(){return '<div class="btns"><button class="btn" type="button" data-share="1">Share list</button><button class="btn alt" type="button" data-clear="1">Clear list</button></div>'}
function listText(){
  var r=basket(),out=["PricePulse shopping list ("+regionName(state.region)+")",""];
  Object.keys(state.list).forEach(function(id){var e=state.list[id];out.push("- "+e.q+" x "+e.name+(e.size?" "+e.size:""))});
  if(r.full.length)out.push("","Cheapest single store: "+r.full[0].s+" "+money(r.full[0].tot));
  if(r.items.length){out.push("Split shop: "+money(r.splitTot));
    Object.keys(r.split).sort().forEach(function(s){out.push("  "+s+": "+r.split[s].map(function(l){return l.p.name}).join(", "))})}
  out.push("",DISCLAIMER);
  return out.join("\n");
}
function shareList(){
  var text=listText();
  if(navigator.share){navigator.share({title:"Shopping list",text:text}).then(function(){say("List shared.")}).catch(function(){});return}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){say("List copied. Paste it into WhatsApp or SMS.")},function(){fallbackCopy(text)});return}
  fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="absolute";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);
  say(ok?"List copied. Paste it into WhatsApp or SMS.":"Could not copy automatically. Select the list text and copy it.");
}

/* ---------- Data tab ---------- */
function viewData(){
  var h=banners()+'<h2 class="h2">Prices and settings</h2>';
  var src={api:"Live prices from the price server.",cache:"Saved prices (offline).",file:"Prices from a file you loaded.",sample:"Example prices (not real)."}[state.source];
  h+='<div class="card"><p style="margin:0"><b>Showing:</b> '+esc(src)+'</p>'+(state.source!=="sample"&&newestPrice()?'<p class="size" style="margin:.3rem 0 0">Newest price: '+esc(fmtDate(newestPrice()))+'. '+state.products.length+' products.</p>':'')+
    '<div class="btns"><button class="btn" type="button" data-reload="1">Reload prices</button></div></div>';
  h+='<h2 class="h2" style="font-size:1.35rem">Colours</h2><div class="seg" role="group" aria-label="Colour theme">'+
    [["system","Like my phone"],["light","Light"],["dark","Dark"]].map(function(t){return '<button type="button" data-theme="'+t[0]+'" aria-pressed="'+(state.theme===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  h+='<h2 class="h2" style="font-size:1.35rem">Privacy</h2><p>Your location is only used on this phone to pick the nearest town. It is never sent to our server. Your shopping list stays on this phone. There are no accounts and no personal data is stored.</p>';
  h+='<h2 class="h2" style="font-size:1.35rem">Test with a scraper file</h2><p class="sub">For testing: load a <b>latest_{town}.json</b> file made by the price scraper. The file stays on your phone.</p>';
  h+='<div class="btns"><label class="btn alt" for="file">Load scraper file</label><input id="file" type="file" accept=".json,application/json" class="vh">'+
     (state.source!=="sample"?'<button class="btn alt" type="button" data-sample="1">Use example prices</button>':'')+'</div><div id="fmsg" class="sub"></div>';
  h+='<details><summary style="min-height:3rem;display:flex;align-items:center;cursor:pointer">File format</summary><pre>{\n  "region": "paarl",\n  "scraped_at": "2026-10-27 07:30",\n  "items": [\n    {"store": "Checkers", "name": "Clover Full Cream Milk",\n     "size": "2L", "category": "Fresh", "price": 36.99,\n     "url": "https://..."}\n  ]\n}</pre><p class="sub">A plain list of rows also works.</p></details>';
  h+='<h2 class="h2" style="font-size:1.35rem">Stores covered</h2><div class="card" style="display:flex;flex-wrap:wrap;gap:.5rem">'+Object.keys(STORES).map(badge).join("")+'</div>';
  return h+disclaimer();
}

/* ---------- Rendering and navigation ---------- */
var ICONS={
  compare:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12M4 12h8M4 17h5"/><path d="M17 14l3 3-3 3"/><path d="M20 17h-6"/></svg>',
  towns:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  data:'<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>'
};
var LABELS={compare:"Compare",towns:"Towns",list:"List",data:"Data"};
function renderNav(){
  var cur=state.view==="product"?"compare":state.view;
  document.getElementById("nav").innerHTML=Object.keys(LABELS).map(function(k){
    var n=k==="list"?listCount():0;
    return '<button type="button" data-view="'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+ICONS[k]+'<span>'+LABELS[k]+(n?'<span class="cnt" aria-label=", '+n+' items">'+n+'</span>':'')+'</span></button>'}).join("");
}
function render(){
  applyTheme();
  var m=document.getElementById("main");
  m.innerHTML=state.view==="compare"?viewCompare():state.view==="towns"?viewTowns():state.view==="list"?viewList():state.view==="product"?viewProduct():viewData();
  renderNav();renderFresh();
  if(state.view==="towns")loadTowns();
  if(state.view==="product")loadDetail();
}
function go(v,focus){
  if(v.indexOf("product/")===0){state.view="product";state.productId=decodeURIComponent(v.slice(8))}
  else if(LABELS[v])state.view=v;else state.view="compare";
  render();window.scrollTo(0,0);
  var target="#"+(state.view==="product"?"product/"+encodeURIComponent(state.productId):state.view);
  if(location.hash!==target){try{history.pushState(null,"",target)}catch(e){location.hash=target}}
  if(focus!==false){var m=document.getElementById("main");m.focus({preventScroll:true})}
}
function save(){store("pp_list",state.list);store("pp_region",state.region);store("pp_unit",state.unitMode);store("pp_theme",state.theme)}
function applyTheme(){
  var root=document.documentElement;
  if(state.theme==="system")root.removeAttribute("data-theme");else root.setAttribute("data-theme",state.theme);
  var dark=state.theme==="dark"||(state.theme==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.dark=dark?"1":"0";
}
function fillRegions(){
  var sel=document.getElementById("base");
  sel.innerHTML=state.regions.map(function(r){return '<option value="'+esc(r.slug)+'">'+esc(r.name)+'</option>'}).join("");
  if(!state.regions.some(function(r){return r.slug===state.region}))state.region=state.regions[0].slug;
  sel.value=state.region;
}
function setRegion(slug){
  if(slug===state.region)return;
  state.region=slug;state.detail=null;state.towns=null;save();
  document.getElementById("base").value=slug;
  if(state.source==="file"){render();return}
  if(!useCache(slug))state.products=[];
  render();loadLive();
}
function locate(){
  if(!navigator.geolocation){say("This phone cannot share its location. Choose your town from the list.");return}
  say("Finding the nearest town\u2026");
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude,best=null;
    state.regions.forEach(function(r){var d=haversine(lat,lon,r.lat,r.lon);if(!best||d<best.d)best={r:r,d:d}});
    if(!best)return;
    setRegion(best.r.slug);
    say("Nearest town: "+best.r.name+", about "+Math.round(best.d)+" km away."+(best.d>80?" That is far; you can choose another town from the list.":""));
  },function(err){
    say(err.code===1?"Location is blocked for this app. Choose your town from the list instead.":"Could not find your location. Choose your town from the list instead.");
  },{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}

document.addEventListener("click",function(e){
  var a=e.target.closest("a[href^='#']");
  if(a){e.preventDefault();go(a.getAttribute("href").slice(1));return}
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.view)return go(d.view);
  if(d.cat){state.cat=d.cat;return render()}
  if(d.unit){state.unitMode=d.unit==="1";save();return render()}
  if(d.radius){state.radius=+d.radius;return render()}
  if(d.scope){state.townScope=d.scope;return render()}
  if(d.add){
    var p=findProduct(d.add);
    if(state.list[d.add]){delete state.list[d.add];say("Removed "+(p?p.name:"item")+" from your list.")}
    else if(p){state.list[d.add]={q:1,name:p.name,size:p.size};say("Added "+p.name+" to your list. "+listCount()+" items on your list.")}
    save();var y=window.scrollY;render();window.scrollTo(0,y);
    var again=document.querySelector('[data-add="'+CSS.escape(d.add)+'"]');if(again)again.focus();return;
  }
  if(d.inc||d.dec){
    var id=d.inc||d.dec,e2=state.list[id];if(!e2)return;
    if(d.inc)e2.q=Math.min(99,e2.q+1);else if(e2.q>1)e2.q--;else{delete state.list[id];say("Removed "+e2.name+".")}
    save();render();var b=document.querySelector('[data-'+(d.inc?'inc':'dec')+'="'+CSS.escape(id)+'"]');if(b)b.focus();
    if(state.list[id])say(e2.name+": "+e2.q);return;
  }
  if(d.clear){if(confirm("Clear your whole list?")){state.list={};save();render();say("List cleared.")}return}
  if(d.share)return shareList();
  if(d.sample){loadSample();state.error="";render();say("Showing example prices.");return}
  if(d.reload){state.error="";loadLive();loadRegions();say("Checking for new prices.");return}
  if(d.theme){state.theme=d.theme;save();render();return}
});
document.addEventListener("change",function(e){
  if(e.target.id!=="file")return;
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var msg=document.getElementById("fmsg");
    try{
      var r=fromRows(JSON.parse(rd.result));
      state.products=r.products;state.source="file";state.stamp=r.stamp;state.isSample=r.sample;state.error="";
      if(r.region&&state.regions.some(function(x){return x.slug===r.region})){state.region=r.region;document.getElementById("base").value=r.region}
      state.cat="All";render();say("Loaded "+r.products.length+" products from the file.");
    }catch(err){if(msg)msg.textContent="Could not read that file. "+err.message;say("Could not read that file.")}
  };
  rd.readAsText(f);
});
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value;
  if(state.view!=="compare"){state.view="compare";try{history.replaceState(null,"","#compare")}catch(x){}}
  render();
});
document.getElementById("base").addEventListener("change",function(e){setRegion(e.target.value)});
document.getElementById("locate").addEventListener("click",locate);
window.addEventListener("popstate",function(){go((location.hash||"#compare").slice(1),false)});
window.addEventListener("online",function(){if(state.source!=="api"&&state.source!=="file")loadLive()});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(state.theme==="system")render()});

/* ---------- Start ---------- */
(function init(){
  state.list=load("pp_list")||{};
  /* Lists saved by the first version were {id: qty}; upgrade them. */
  Object.keys(state.list).forEach(function(k){if(typeof state.list[k]==="number")state.list[k]={q:state.list[k],name:k.split("|")[0],size:k.split("|")[1]||""}});
  state.region=load("pp_region")||"paarl";state.unitMode=!!load("pp_unit");state.theme=load("pp_theme")||"system";
  var rs=load("pp_regions");if(Array.isArray(rs)&&rs.length)state.regions=rs;
  fillRegions();
  if(!useCache(state.region))loadSample();
  var h=(location.hash||"").slice(1);
  if(h.indexOf("product/")===0){state.view="product";state.productId=decodeURIComponent(h.slice(8))}else if(LABELS[h])state.view=h;
  render();
  if(location.protocol!=="file:"){loadRegions();loadLive()}
  var secure=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if("serviceWorker" in navigator&&secure)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
