# Regions the app knows about, and how each store must be told which branch to price.
#
# STATUS: the per-store settings below are NOT VERIFIED against the live sites yet.
# The build environment could not reach the retailer websites. Before trusting
# regional prices, run:  python run_scrapers.py --region paarl --store "Pick n Pay" --debug
# and follow docs/FIX_A_SCRAPER.md.
#
# regional_pricing per store:
#   national  - one price everywhere; the same prices are stored for every region.
#   postcode  - the scraper sets a delivery/collection postal code before searching.
#   branch    - the scraper selects a branch/store code before searching.
#   unknown   - not checked yet; treated as national until someone checks.

stores:
  Checkers:
    regional_pricing: unknown
  Pick n Pay:
    regional_pricing: unknown
  Woolworths:
    regional_pricing: unknown
  Ultra Liquors:
    regional_pricing: unknown
  Liquorland:
    regional_pricing: unknown
  Dis-Chem:
    regional_pricing: unknown

