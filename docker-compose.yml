# App and API (what the Contabo test server runs):   docker compose up -d --build api
# Logs:                                              docker compose logs -f api
# The scraper does NOT start by default. For now the scrapers run on the owner's PC
# (South African address); retailers may block or re-price a data-centre address.
# To run the timetable on a server later:            docker compose --profile scraper up -d
# The API and the scraper share one data folder (SQLite database + JSON files).
services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: backend/.env
    environment:
      PP_DATA_DIR: /data
    volumes:
      - ppdata:/data
    ports:
      # Only this server can reach port 8000; the public reaches the app through Caddy (HTTPS).
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  scraper:
    profiles: ["scraper"]
    build: { context: ., dockerfile: Dockerfile.scraper }
    env_file: backend/.env
    environment:
      PP_DATA_DIR: /data
    volumes:
      - ppdata:/data
    restart: unless-stopped
    depends_on: [api]

volumes:
  ppdata:
